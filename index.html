<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Ancore CRM Financeiro</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.4/chart.umd.min.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');
  :root{
    --red:#DB3937; --red-dark:#FF6B65; --green:#3DDC84; --amber:#F0B429; --black:#0D0E10;
    --silver:#2E3036; --ice:#12202B; --muted:#9AA1A9; --page-bg:#0A0A0F; --surface:#1A1A24;
    --surface-alt:#22222E; --text:#EDEEF0; --border-soft:#2B2C38;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;background:var(--page-bg);color:var(--text);}
  body{font-family:'Inter',system-ui,-apple-system,sans-serif;}
  button{transition:filter .15s ease,opacity .15s ease,transform .1s ease;font-family:inherit;}
  button:hover{filter:brightness(1.12);}
  button:active{transform:scale(0.98);}
  input,select,textarea{transition:border-color .15s ease;font-family:inherit;}
  input:focus,select:focus,textarea:focus{border-color:var(--red)!important;outline:none;}
  a{color:inherit;}
  ::-webkit-scrollbar{width:10px;height:10px;}
  ::-webkit-scrollbar-thumb{background:var(--silver);border-radius:6px;}
  .ancore-card{animation:fadeIn .25s ease both;}
  @keyframes fadeIn{from{opacity:0;transform:translateY(4px);}to{opacity:1;transform:translateY(0);}}
  .grid-2col{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
  .grid-3col{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;}
  @media (max-width:900px){ .grid-2col{grid-template-columns:1fr!important;} .grid-3col{grid-template-columns:1fr!important;} }
  table{border-collapse:collapse;width:100%;font-size:13px;min-width:720px;}
  th{background:var(--black);color:#fff;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;text-align:left;padding:10px 14px;white-space:nowrap;cursor:pointer;user-select:none;}
  td{padding:10px 14px;color:var(--text);border-bottom:1px solid var(--border-soft);}
  tr.rowclick{cursor:pointer;}
  .icon-btn{background:none;border:none;cursor:pointer;color:var(--muted);padding:5px;margin-right:2px;}
  .icon-btn.del{color:var(--red);}
  .btn-primary{background:var(--red);color:#fff;border:none;border-radius:8px;padding:10px 18px;font-size:13px;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;gap:8px;white-space:nowrap;}
  .btn-ghost{background:var(--surface);color:var(--text);border:1px solid var(--silver);border-radius:8px;padding:10px 18px;font-size:13px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:8px;white-space:nowrap;text-decoration:none;}
  .btn-ghost.active{background:var(--red);border-color:var(--red);}
  .field-label{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);display:block;margin-bottom:6px;}
  .input,select,textarea.input{border:1px solid var(--silver);border-radius:8px;padding:9px 11px;font-size:14px;color:var(--text);background:var(--surface);outline:none;width:100%;}
  textarea.input{resize:vertical;}
  .badge{font-size:11px;font-weight:700;padding:3px 9px;border-radius:999px;white-space:nowrap;display:inline-block;}
  .tone-green{background:rgba(61,220,132,.16);color:var(--green);}
  .tone-red{background:rgba(255,107,101,.16);color:var(--red-dark);}
  .tone-amber{background:rgba(240,180,41,.18);color:var(--amber);}
  .tone-blue{background:rgba(96,165,250,.16);color:#60A5FA;}
  .tone-gray{background:rgba(255,255,255,.08);color:var(--muted);}
  .card{background:var(--surface);border-radius:14px;border:1px solid var(--silver);padding:22px;box-shadow:0 4px 24px rgba(0,0,0,.35);}
  .kpi{background:var(--surface);border-radius:14px;padding:18px 20px;flex:1;min-width:190px;border:1px solid var(--silver);display:flex;flex-direction:column;gap:9px;box-shadow:0 4px 24px rgba(0,0,0,.35);}
  .kpi .lbl{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;}
  .kpi .val{font-size:23px;font-weight:800;color:var(--text);letter-spacing:-.01em;}
  .kpi .sub{font-size:11.5px;font-weight:700;display:flex;align-items:center;gap:4px;}
  .modal-overlay{position:fixed;inset:0;background:rgba(23,24,26,.55);display:flex;align-items:flex-start;justify-content:center;padding:5vh 16px;z-index:60;overflow-y:auto;}
  .modal-box{background:var(--surface);border-radius:14px;width:100%;max-width:560px;box-shadow:0 20px 60px rgba(0,0,0,.5);overflow:hidden;}
  .modal-box.wide{max-width:860px;}
  .modal-head{background:var(--black);padding:16px 22px;display:flex;align-items:center;justify-content:space-between;border-top:3px solid var(--red);}
  .modal-body{padding:22px;max-height:80vh;overflow-y:auto;}
  .section-title{font-size:12.5px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin:0 0 16px;display:flex;justify-content:space-between;align-items:center;}
  .table-wrap{background:var(--surface);border-radius:12px;border:1px solid var(--silver);overflow:hidden;}
  .table-scroll{overflow-x:auto;}
  .pager{display:flex;justify-content:space-between;align-items:center;padding:10px 16px;border-top:1px solid var(--border-soft);font-size:12.5px;color:var(--muted);}
  svg.ic{flex-shrink:0;}
</style>
</head>
<body>
<div id="app"></div>
<div id="modalRoot"></div>

<script>
/* =================================================================
   ANCORE CRM + ERP FINANCEIRO — versão HTML/JS puro
================================================================= */

/* ---------------- CONSTANTES ---------------- */
const RED="#DB3937", RED_DARK="#FF6B65", GREEN="#3DDC84", AMBER="#F0B429", BLACK="#0D0E10";
const SILVER="#2E3036", MUTED="#9AA1A9", SURFACE="#1A1A24", SURFACE_ALT="#22222E";
const PIE_COLORS=[RED,"#5B8DEF",AMBER,GREEN,"#A78BFA","#F472B6"];

const K={
  associados:"ancore:crm:associados", vendas:"ancore:crm:vendas", financeiro:"ancore:crm:despesas",
  metas:"ancore:crm:metas", indicacoes:"ancore:crm:indicacoes", config:"ancore:crm:config",
  equipe:"ancore:crm:equipe", producaoEquipe:"ancore:crm:producao-equipe",
};

const ORIGEM_OPTS=["Indicação","Instagram","Google","WhatsApp","Prospecção","Cliente antigo","Outros"];
const PAGAMENTO_OPTS=["Boleto","Pix","Cartão de crédito","Débito automático"];
const PLANO_OPTS=["Bronze","Prata","Ouro"];
const VENDA_STATUS_OPTS=["Ativa","Ativa Pendente","Inadimplente","Cancelada"];
const INDIC_STATUS_OPTS=["Pendente","Pago"];
const CONSULTORIA_VALORES=[10,20,30,40,50];
const CARGO_OPTS=["Consultor","Líder","Gestor"];
const STATUS_EQUIPE_OPTS=["Ativo","Inativo"];

const PLANO_FAIXAS=[
  {nivel:"Consultor",min:0,premiacao:0},
  {nivel:"Líder",min:30,premiacao:1000},
  {nivel:"Gestor Executivo",min:50,premiacao:2500},
  {nivel:"Gestor Executivo 2",min:75,premiacao:3000},
  {nivel:"Gestor Executivo 3",min:100,premiacao:3500},
];
const PREMIACAO_MENSAL_FAIXAS=[{min:5,valor:300},{min:10,valor:600},{min:15,valor:900},{min:20,valor:1300}];
const PREMIACAO_SEMANAL_BLOCO=5, PREMIACAO_SEMANAL_VALOR=150;
const RECORRENCIA_BLOCO=100, RECORRENCIA_VALOR_POR_BLOCO=500, RECORRENCIA_VENDAS_MINIMAS_MES=10;
const CONSULTORIA_PLACAS_ATIVAS_MINIMAS=10, EQUIPE_MIN_ELEGIVEIS=2, EQUIPE_VENDAS_MIN_POR_PESSOA=3;
const CALENDARIO={
  consultoria:{nf:13,pagamento:15,label:"Consultoria Especializada"},
  recorrencia:{nf:18,pagamento:20,label:"Recorrência"},
  planoDeCarreira:{nf:22,pagamento:25,label:"Plano de Carreira"},
  premiacoes:{nf:22,pagamento:25,label:"Premiações Mensais e Semanais"},
};
function dataDoMes(mes,dia){ return `${mes}-${String(dia).padStart(2,"0")}`; }
const DEFAULT_CONFIG={meuCargo:"Consultor"};

/* ---------------- HELPERS ---------------- */
function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,8); }
function toNumber(v){ if(v===""||v===null||v===undefined) return 0; const n=typeof v==="number"?v:parseFloat(v); return isNaN(n)?0:n; }
function formatBRL(n){ return (n||0).toLocaleString("pt-BR",{style:"currency",currency:"BRL"}); }
function formatDateBR(iso){ if(!iso) return "—"; const [y,m,d]=iso.split("-"); if(!y||!m||!d) return iso; return `${d}/${m}/${y}`; }
function monthLabel(ym){ if(!ym) return "—"; const [y,m]=ym.split("-"); const meses=["Jan","Fev","Mar","Abr","Mai","Jun","Jul","Ago","Set","Out","Nov","Dez"]; const idx=parseInt(m,10)-1; return `${meses[idx]??m}/${(y||"").slice(2)}`; }
function pctChange(atual,anterior){ if(!anterior) return null; return ((atual-anterior)/anterior)*100; }
function trendText(valorAtual,valorAnterior,contexto){ const pct=pctChange(valorAtual,valorAnterior); if(pct===null) return "Ainda não há mês anterior suficiente para comparar."; if(Math.abs(pct)<3) return `${contexto||"O indicador"} apresentou estabilidade em relação ao mês anterior.`; const dir=pct>=0?"Crescimento":"Queda"; return `${dir} de ${Math.abs(pct).toFixed(0)}% em relação ao mês anterior.`; }
function currentMonth(){ const d=new Date(); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}`; }
function prevMonth(ym){ const [y,m]=ym.split("-").map(Number); const d=new Date(y,m-2,1); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}`; }
function mondayOf(dateStr){ const d=new Date(dateStr+"T00:00:00"); if(isNaN(d.getTime())) return ""; const day=d.getDay(); const diff=day===0?-6:1-day; const monday=new Date(d); monday.setDate(d.getDate()+diff); return monday.toISOString().slice(0,10); }
function monthsBetween(iso){ if(!iso) return 0; const start=new Date(iso); const now=new Date(); return Math.max(0,(now.getFullYear()-start.getFullYear())*12+(now.getMonth()-start.getMonth())); }
function daysUntilBirthday(iso){ if(!iso) return 9999; const parts=iso.split("-").map(Number); const m=parts[1], d=parts[2]; const now=new Date(); let next=new Date(now.getFullYear(),m-1,d); if(next<new Date(now.getFullYear(),now.getMonth(),now.getDate())){ next=new Date(now.getFullYear()+1,m-1,d);} return Math.round((next-new Date(now.getFullYear(),now.getMonth(),now.getDate()))/86400000); }
function ageFromDate(iso){ if(!iso) return "—"; const [y,m,d]=iso.split("-").map(Number); const now=new Date(); let age=now.getFullYear()-y; if(now.getMonth()+1<m||(now.getMonth()+1===m&&now.getDate()<d)) age--; return age; }
function onlyDigits(s){ return (s||"").replace(/\D/g,""); }
function waLink(phone){ return `https://wa.me/55${onlyDigits(phone)}`; }
function nomeDoIndicado(i,associadoNome){ if(i.indicadoId) return associadoNome(i.indicadoId); if(i.indicadoNomeManual) return `${i.indicadoNomeManual} (não cadastrado)`; return "—"; }
function addDays(iso,n){ if(!iso) return ""; const d=new Date(iso+"T00:00:00"); if(isNaN(d.getTime())) return ""; d.setDate(d.getDate()+n); return d.toISOString().slice(0,10); }
function calcPrimeiroBoleto(dataVendaISO){
  if(!dataVendaISO) return "";
  const d=new Date(dataVendaISO+"T00:00:00");
  if(isNaN(d.getTime())) return "";
  const dia=d.getDate(); let mes=d.getMonth(); let ano=d.getFullYear(); let diaAlvo;
  if(dia<=9){ diaAlvo=10; mes+=1; } else if(dia<=24){ diaAlvo=25; mes+=1; } else { diaAlvo=10; mes+=2; }
  const alvo=new Date(ano,mes,diaAlvo); return alvo.toISOString().slice(0,10);
}
function getPrimeiroBoleto(venda){ return (venda&&venda.primeiroBoletoManual)||calcPrimeiroBoleto(venda&&venda.data); }
function exportXLSX(rows,filename,sheetName){
  const ws=XLSX.utils.json_to_sheet(rows); const wb=XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb,ws,sheetName||"Dados"); XLSX.writeFile(wb,filename);
}
function esc(s){ return (s===null||s===undefined)?"":String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }

/* ---------------- REGRAS ANCORE / MOTOR FINANCEIRO ---------------- */
function computePortfolioMetrics(vendas){
  const ativas=vendas.filter(v=>v.status==="Ativa");
  const placasAtivasSet=new Set(ativas.map(v=>(v.veiculoPlaca||"").toUpperCase()).filter(Boolean));
  const placasAtivas=placasAtivasSet.size;
  const consultoriasAtivas=ativas.filter(v=>toNumber(v.consultoria)>0).length;
  const consultoriasVendidas=vendas.filter(v=>toNumber(v.consultoria)>0).length;
  const totalPlacasVendidas=vendas.length;
  const vendasComAdesao=vendas.filter(v=>toNumber(v.valorAdesao)>0);
  const ticketMedioGeral=vendasComAdesao.length?vendasComAdesao.reduce((s,v)=>s+toNumber(v.valorAdesao),0)/vendasComAdesao.length:0;
  const ativaPendentes=vendas.filter(v=>v.status==="Ativa Pendente").length;
  const inadimplentes=vendas.filter(v=>v.status==="Inadimplente").length;
  const cancelados=vendas.filter(v=>v.status==="Cancelada").length;
  return {ativas,placasAtivas,consultoriasAtivas,consultoriasVendidas,totalPlacasVendidas,ticketMedioGeral,ativaPendentes,inadimplentes,cancelados};
}
function vendasDoMes(vendas,mes){ return vendas.filter(v=>(v.data||"").startsWith(mes)); }
function jaFaturandoEm(venda,mesRef){ const primeiroBoleto=getPrimeiroBoleto(venda); if(!primeiroBoleto) return false; return primeiroBoleto<=`${mesRef}-31`; }
function computePremiacaoMensal(qtdPlacas){ let valor=0; for(const f of PREMIACAO_MENSAL_FAIXAS){ if(qtdPlacas>=f.min) valor=f.valor; } return valor; }
function computePremiacaoSemanalDoMes(vendas,mes){
  const byWeek={};
  vendas.forEach(v=>{ if(!v.data) return; const monday=mondayOf(v.data); if(!monday.startsWith(mes)) return; byWeek[monday]=(byWeek[monday]||0)+1; });
  const weeks=Object.entries(byWeek).sort((a,b)=>a[0].localeCompare(b[0])).map(([monday,count])=>({monday,count,valor:Math.floor(count/PREMIACAO_SEMANAL_BLOCO)*PREMIACAO_SEMANAL_VALOR}));
  return {total:weeks.reduce((s,w)=>s+w.valor,0),weeks};
}
function computePlanoCarreiraDoMes(vendas,producaoEquipe,consultores,mes){
  const producaoPessoal=vendasDoMes(vendas,mes).length;
  const producaoEquipeDoMes=producaoEquipe.filter(p=>p.competencia===mes);
  const producaoEquipeTotal=producaoEquipeDoMes.reduce((s,p)=>s+toNumber(p.placasVendidas),0);
  const producaoTotal=producaoPessoal+producaoEquipeTotal;
  const selecionados=(consultores||[]).filter(c=>c.selecionadoPlanoCarreira);
  const elegiveisEquipe=selecionados.filter(c=>{ const p=producaoEquipeDoMes.find(x=>x.consultorId===c.id); return p&&toNumber(p.placasVendidas)>=EQUIPE_VENDAS_MIN_POR_PESSOA; }).length;
  const requisitoEquipeOk=selecionados.length>=EQUIPE_MIN_ELEGIVEIS&&elegiveisEquipe>=EQUIPE_MIN_ELEGIVEIS;
  const faixa=[...PLANO_FAIXAS].reverse().find(f=>producaoTotal>=f.min)||PLANO_FAIXAS[0];
  const premiacaoLiberada=faixa.premiacao>0&&requisitoEquipeOk?faixa.premiacao:0;
  return {mes,producaoPessoal,producaoEquipeTotal,producaoTotal,elegiveisEquipe,requisitoEquipeOk,faixa,premiacaoLiberada};
}
function computeFinanceiroMes(vendas,producaoEquipe,indicacoes,config,mes,consultores){
  const mesAnterior=prevMonth(mes);
  const vMes=vendasDoMes(vendas,mes);
  const adesoesMes=vMes.reduce((s,v)=>s+toNumber(v.valorAdesao),0);
  const totalAdesoesQtd=vMes.length;
  const ticketMedio=totalAdesoesQtd?adesoesMes/totalAdesoesQtd:0;
  const vendasMesAnterior=vendasDoMes(vendas,mesAnterior);
  const placasVendidasMesAnterior=vendasMesAnterior.length;
  const premiacaoMensal=computePremiacaoMensal(placasVendidasMesAnterior);
  const semanal=computePremiacaoSemanalDoMes(vendas,mesAnterior);
  const premiacaoSemanal=semanal.total;
  const consultoriasAtivasTotal=vendas.filter(v=>v.status==="Ativa"&&toNumber(v.consultoria)>0&&jaFaturandoEm(v,mesAnterior)).length;
  const minVendasConsultoria=config.meuCargo==="Gestor"?3:5;
  const consultoriaElegivel=consultoriasAtivasTotal>=CONSULTORIA_PLACAS_ATIVAS_MINIMAS&&placasVendidasMesAnterior>=minVendasConsultoria;
  const consultoriaPrevista=consultoriaElegivel?vendas.filter(v=>v.status==="Ativa"&&toNumber(v.consultoria)>0&&jaFaturandoEm(v,mesAnterior)).reduce((s,v)=>s+toNumber(v.consultoria),0):0;
  const placasAtivasMesAnterior=vendas.filter(v=>v.status==="Ativa"&&jaFaturandoEm(v,mesAnterior)).length;
  const recorrenciaElegivel=placasVendidasMesAnterior>=RECORRENCIA_VENDAS_MINIMAS_MES;
  const recorrenciaBlocos=Math.floor(placasAtivasMesAnterior/RECORRENCIA_BLOCO);
  const recorrenciaPrevista=recorrenciaElegivel?recorrenciaBlocos*RECORRENCIA_VALOR_POR_BLOCO:0;
  const producaoEquipeMesAnterior=producaoEquipe.filter(p=>p.competencia===mesAnterior);
  const producaoEquipeTotal=producaoEquipeMesAnterior.reduce((s,p)=>s+toNumber(p.placasVendidas),0);
  const producaoPessoal=placasVendidasMesAnterior;
  const producaoTotal=producaoPessoal+producaoEquipeTotal;
  const selecionadosPlanoCarreira=(consultores||[]).filter(c=>c.selecionadoPlanoCarreira);
  const elegiveisEquipe=selecionadosPlanoCarreira.filter(c=>{ const p=producaoEquipeMesAnterior.find(x=>x.consultorId===c.id); return p&&toNumber(p.placasVendidas)>=EQUIPE_VENDAS_MIN_POR_PESSOA; }).length;
  const requisitoEquipeOk=selecionadosPlanoCarreira.length>=EQUIPE_MIN_ELEGIVEIS&&elegiveisEquipe>=EQUIPE_MIN_ELEGIVEIS;
  const faixa=[...PLANO_FAIXAS].reverse().find(f=>producaoTotal>=f.min)||PLANO_FAIXAS[0];
  const planoDeCarreiraPrevisto=faixa.premiacao>0&&requisitoEquipeOk?faixa.premiacao:0;
  const indicacoesPagas=indicacoes.filter(i=>i.status==="Pago"&&(i.data||"").startsWith(mes)).reduce((s,i)=>s+toNumber(i.valorComissao),0);
  const totalPrevisto=adesoesMes+premiacaoMensal+premiacaoSemanal+consultoriaPrevista+planoDeCarreiraPrevisto+recorrenciaPrevista-indicacoesPagas;
  return {mes,mesAnterior,adesoesMes,totalAdesoesQtd,ticketMedio,premiacaoMensal,placasVendidasMesAnterior,premiacaoSemanal,semanalDetalhe:semanal.weeks,
    consultoriaPrevista,consultoriaElegivel,consultoriasAtivasTotal,minVendasConsultoria,recorrenciaPrevista,recorrenciaElegivel,placasAtivasMesAnterior,recorrenciaBlocos,
    producaoPessoal,producaoEquipeTotal,producaoTotal,elegiveisEquipe,requisitoEquipeOk,faixa,planoDeCarreiraPrevisto,indicacoesPagas,totalPrevisto};
}

/* ---------------- SCHEMAS ---------------- */
const ASSOCIADO_SCHEMA=[
  {key:"nomeCompleto",label:"Nome completo",span:2},
  {key:"cpf",label:"CPF",placeholder:"000.000.000-00"},
  {key:"telefone",label:"Telefone",placeholder:"(00) 00000-0000"},
  {key:"email",label:"E-mail",type:"email"},
  {key:"origem",label:"Origem",type:"select",options:ORIGEM_OPTS},
  {key:"dataNascimento",label:"Data de nascimento",type:"date"},
];
const VENDA_SCHEMA=[
  {key:"data",label:"Data do contrato",type:"date"},
  {key:"associadoId",label:"Associado",type:"lookup",span:2,lookupName:"associadoId"},
  {key:"veiculoModelo",label:"Modelo do veículo"},
  {key:"veiculoPlaca",label:"Placa",placeholder:"ABC1D23"},
  {key:"plano",label:"Plano",type:"select",options:PLANO_OPTS},
  {key:"status",label:"Status",type:"select",options:VENDA_STATUS_OPTS},
  {key:"valorAdesao",label:"Valor da adesão (R$)",type:"number",placeholder:"249,90"},
  {key:"consultoria",label:"Consultoria especializada (R$)",type:"select",options:CONSULTORIA_VALORES.map(String)},
  {key:"primeiraMensalidade",label:"Valor da 1ª mensalidade (R$)",type:"number",placeholder:"179,50"},
  {key:"primeiroBoletoManual",label:"Data do 1º boleto (editar apenas se diferente da regra automática)",type:"date"},
  {key:"dataUltimoBoletoPago",label:"Data do último boleto pago (cancelamento/inadimplência)",type:"date"},
  {key:"observacoes",label:"Observações",type:"textarea",span:2},
];
const DESPESA_SCHEMA=[
  {key:"competencia",label:"Competência",type:"month",span:2},
  {key:"despesas",label:"Despesas (R$)",type:"number"},
  {key:"outrasReceitas",label:"Outras receitas (R$)",type:"number"},
  {key:"observacoes",label:"Observações",type:"textarea",span:2},
];
const INDICACAO_SCHEMA=[
  {key:"indicadorId",label:"Associado que indicou",type:"lookup",span:2,lookupName:"indicadorId"},
  {key:"data",label:"Data da indicação",type:"date"},
  {key:"valorComissao",label:"Valor da comissão (R$)",type:"number"},
  {key:"status",label:"Status",type:"select",options:INDIC_STATUS_OPTS},
];
const CONSULTOR_SCHEMA=[
  {key:"nome",label:"Nome do consultor",span:2},
  {key:"status",label:"Status",type:"select",options:STATUS_EQUIPE_OPTS},
  {key:"dataEntrada",label:"Data de entrada",type:"date"},

/* ---------------- STORAGE / DB ----------------
   window.storage só existe dentro do ambiente de artifacts do Claude.
   Fora dele (Vercel, GitHub Pages, servidor próprio etc.) usamos localStorage
   do navegador como alternativa, para que os dados continuem sendo salvos.
   IMPORTANTE: localStorage é por NAVEGADOR/DISPOSITIVO — ver aviso no chat.
------------------------------------------------- */
const hasClaudeStorage = typeof window!=="undefined" && window.storage && typeof window.storage.get==="function";
const storage = hasClaudeStorage ? window.storage : {
  async get(key){
    try{
      const v=window.localStorage.getItem(key);
      return v===null ? null : {key,value:v};
    }catch(e){ return null; }
  },
  async set(key,value){
    try{ window.localStorage.setItem(key,value); return {key,value}; }
    catch(e){ console.error("Erro ao salvar no localStorage",e); return null; }
  },
};

const DB={ associados:[], vendas:[], despesas:[], metas:[], indicacoes:[], equipe:[], producaoEquipe:[], config:{...DEFAULT_CONFIG} };
let LOADING=true;

async function loadAll(){
  const keys=["associados","vendas","financeiro","metas","indicacoes","equipe","producaoEquipe"];
  const map={associados:"associados",vendas:"vendas",financeiro:"despesas",metas:"metas",indicacoes:"indicacoes",equipe:"equipe",producaoEquipe:"producaoEquipe"};
  for(const k of keys){
    try{ const r=await storage.get(K[k]); if(r&&r.value) DB[map[k]]=JSON.parse(r.value); }catch(e){ /* ainda não existe */ }
  }
  try{ const r=await storage.get(K.config); if(r&&r.value) DB.config={...DEFAULT_CONFIG,...JSON.parse(r.value)}; }catch(e){}
  LOADING=false;
  render();
}
async function persist(collName,list){
  DB[collName]=list;
  const keyMap={associados:K.associados,vendas:K.vendas,despesas:K.financeiro,metas:K.metas,indicacoes:K.indicacoes,equipe:K.equipe,producaoEquipe:K.producaoEquipe};
  try{ await storage.set(keyMap[collName],JSON.stringify(list)); }catch(e){ console.error("Erro ao salvar",collName,e); }
}
async function persistConfig(cfg){
  DB.config=cfg;
  try{ await storage.set(K.config,JSON.stringify(cfg)); }catch(e){ console.error("Erro ao salvar config",e); }
}
function collSave(collName,item){
  const items=DB[collName];
  let next;
  if(item.id){ next=items.map(i=>i.id===item.id?item:i); }
  else{ next=[{...item,id:uid()},...items]; }
  persist(collName,next).then(rerender);
}
function collRemove(collName,id){
  persist(collName,DB[collName].filter(i=>i.id!==id)).then(rerender);
}

function rerender(){
  const active=document.activeElement;
  let id=null, selStart=null, selEnd=null, scrollY=window.scrollY;
  if(active && active.id){ id=active.id; if("selectionStart" in active){ try{ selStart=active.selectionStart; selEnd=active.selectionEnd; }catch(e){} } }
  render();
  if(id){
    const el=document.getElementById(id);
    if(el){ el.focus(); if(selStart!=null && el.setSelectionRange){ try{ el.setSelectionRange(selStart,selEnd);}catch(e){} } }
  }
  window.scrollTo(0,scrollY);
}

/* Generic sortable/paginated data table.
   columns: [{key,label,render(row)}]
   tableId: unique id used for sort/page state + row actions
*/
function dataTable(tableId,columns,rows,opts){
  opts=opts||{};
  const st=(UI.sort[tableId])||null;
  let sortedRows=rows;
  if(opts.sortable && st){
    sortedRows=[...rows].sort((a,b)=>{
      const av=a[st.key], bv=b[st.key];
      const an=parseFloat(av), bn=parseFloat(bv);
      const bothNumeric = av!==""&&bv!==""&&av!==undefined&&bv!==undefined&&!isNaN(an)&&!isNaN(bn);
      const cmp=bothNumeric? an-bn : String(av??"").localeCompare(String(bv??""));
      return st.dir==="asc"?cmp:-cmp;
    });
  }
  const pageSize=opts.pageSize||null;
  let page=UI.page[tableId]||0;
  const totalPages=pageSize?Math.max(1,Math.ceil(sortedRows.length/pageSize)):1;
  if(page>totalPages-1) page=totalPages-1;
  const pageRows=pageSize?sortedRows.slice(page*pageSize,page*pageSize+pageSize):sortedRows;

  const hasActions = opts.onEdit||opts.onDelete;
  const thead=`<tr>${columns.map(c=>`<th data-sortkey="${esc(c.key)}" data-table="${tableId}" ${opts.sortable?'class="sortableTh"':''}>${esc(c.label)}${opts.sortable&&st&&st.key===c.key?(st.dir==="asc"?" ▲":" ▼"):""}</th>`).join("")}${hasActions?'<th></th>':''}</tr>`;

  let tbody;
  if(pageRows.length===0){
    tbody=`<tr><td colspan="${columns.length+(hasActions?1:0)}" style="padding:30px;text-align:center;color:${MUTED}">${esc(opts.emptyText||"Nenhum registro.")}</td></tr>`;
  }else{
    tbody=pageRows.map((row,i)=>{
      const cells=columns.map(c=>`<td>${c.render?c.render(row):(row[c.key]??"—")}</td>`).join("");
      const actions=hasActions?`<td style="white-space:nowrap;">
        ${opts.onEdit?`<button class="icon-btn" data-action="edit" data-table="${tableId}" data-id="${row.id}">${ic('pencil',14)}</button>`:""}
        ${opts.onDelete?`<button class="icon-btn del" data-action="delete" data-table="${tableId}" data-id="${row.id}">${ic('trash',14)}</button>`:""}
      </td>`:"";
      const rowClickAttr = opts.onRowClick ? `class="rowclick" data-action="rowclick" data-table="${tableId}" data-id="${row.id}"` : "";
      return `<tr style="background:${i%2?SURFACE_ALT:SURFACE}" ${rowClickAttr}>${cells}${actions}</tr>`;
    }).join("");
  }
  let pager="";
  if(pageSize && sortedRows.length>pageSize){
    pager=`<div class="pager"><span>${sortedRows.length} registro(s) · página ${page+1} de ${totalPages}</span>
      <div style="display:flex;gap:8px;">
        <button class="icon-btn" data-action="pagePrev" data-table="${tableId}" ${page===0?'style="opacity:.4"':''}>${ic('chevronLeft',16)}</button>
        <button class="icon-btn" data-action="pageNext" data-table="${tableId}" ${page>=totalPages-1?'style="opacity:.4"':''}>${ic('chevronRight',16)}</button>
      </div></div>`;
  }
  DB._tableRegistry=DB._tableRegistry||{};
  DB._tableRegistry[tableId]={rows,opts};
  return `<div class="table-wrap"><div class="table-scroll"><table><thead>${thead}</thead><tbody>${tbody}</tbody></table></div>${pager}</div>`;
}

function fieldHTML(f,draft,lookupOptions){
  const val=draft[f.key]??"";
  const span=f.span?`grid-column:span ${f.span}`:"";
  const id=`field-${f.key}`;
  let control;
  if(f.type==="lookup"){
    const opts=(lookupOptions&&lookupOptions[f.lookupName])||[];
    control=`<select class="input" id="${id}" data-field="${f.key}" data-kind="modalfield">
      <option value="">Selecionar…</option>
      ${opts.map(o=>`<option value="${esc(o.id)}" ${val===o.id?'selected':''}>${esc(o.label)}${o.sub?` (${esc(o.sub)})`:""}</option>`).join("")}
    </select>`;
  }else if(f.type==="select"){
    control=`<select class="input" id="${id}" data-field="${f.key}" data-kind="modalfield">
      <option value="">Selecionar…</option>
      ${f.options.map(o=>`<option value="${esc(o)}" ${val===o?'selected':''}>${esc(o)}</option>`).join("")}
    </select>`;
  }else if(f.type==="textarea"){
    control=`<textarea class="input" id="${id}" data-field="${f.key}" data-kind="modalfield" rows="3">${esc(val)}</textarea>`;
  }else{
    control=`<input class="input" id="${id}" type="${f.type||'text'}" ${f.type==='number'?'step="0.01" inputmode="decimal"':''} placeholder="${esc(f.placeholder||'')}" value="${esc(val)}" data-field="${f.key}" data-kind="modalfield" />`;
  }
  return `<label style="display:flex;flex-direction:column;gap:6px;${span}"><span class="field-label">${esc(f.label)}</span>${control}</label>`;
}
function schemaFormHTML(schema,draft,lookupOptions){

            <label style="display:flex;flex-direction:column;gap:6px;"><span class="field-label">Tipo</span>
              <select class="input" id="meta-tipo" data-kind="metafield" data-field="tipo">
                <option value="mensal" ${d.tipo==='mensal'?'selected':''}>mensal</option>

              <input class="input" id="meta-periodo" type="${d.tipo==='anual'?'number':'month'}" placeholder="${d.tipo==='anual'?'2026':''}" value="${esc(d.periodo||'')}" data-kind="metafield" data-field="periodo" /></label>
            ${metaNumField('metaFinanceira','Meta financeira (R$)',d)}
            ${metaNumField('metaVendas','Meta de vendas',d)}
            ${metaNumField('metaPlacas','Meta de placas',d)}
            ${metaNumField('metaRecorrencia','Meta de recorrência (R$)',d)}
            ${metaNumField('metaConsultoria','Meta de consultoria (R$)',d)}

          </div>
        </div>

  </div>`;
}
function metaNumField(key,label,d){
  return `<label style="display:flex;flex-direction:column;gap:6px;"><span class="field-label">${esc(label)}</span>
    <input class="input" type="number" value="${esc(d[key]||'')}" data-kind="metafield" data-field="${key}" /></label>`;
}

              <input class="input" type="number" step="0.01" value="${esc(d.valorComissao||'')}" data-kind="indfield" data-field="valorComissao" /></label>
            <label style="display:flex;flex-direction:column;gap:6px;"><span class="field-label">Status</span>

/* ---------------- DASHBOARD ---------------- */
function renderDashboard(){
  const mes=UI.dashboardMes;
  const vendas=DB.vendas, producaoEquipe=DB.producaoEquipe, indicacoes=DB.indicacoes, config=DB.config, consultores=DB.equipe, associados=DB.associados, metas=DB.metas;
  const metrics=computePortfolioMetrics(vendas);
  const finPeriodo=computeFinanceiroMes(vendas,producaoEquipe,indicacoes,config,mes,consultores);
  const metaMes=metas.find(m=>m.tipo==="mensal"&&m.periodo===mes);
  const percentualMeta=metaMes&&toNumber(metaMes.metaFinanceira)?Math.min(999,(finPeriodo.totalPrevisto/toNumber(metaMes.metaFinanceira))*100):null;
  const placasRealizadasMes=vendas.filter(v=>(v.data||"").startsWith(mes)).length;
  const metaPlacasPct=metaMes&&toNumber(metaMes.metaPlacas)?Math.min(100,(placasRealizadasMes/toNumber(metaMes.metaPlacas))*100):null;
  const producaoEquipeMesAtual=producaoEquipe.filter(p=>p.competencia===mes).reduce((s,p)=>s+toNumber(p.placasVendidas),0);
  const metaEquipePct=metaMes&&toNumber(metaMes.metaVendas)?Math.min(100,(producaoEquipeMesAtual/toNumber(metaMes.metaVendas))*100):null;
  const datasCalendario=Object.values(CALENDARIO).map(c=>({...c,dataNf:dataDoMes(mes,c.nf),dataPagamento:dataDoMes(mes,c.pagamento)}));
  const consultoriasAtivasValor=vendas.filter(v=>v.status==="Ativa"&&toNumber(v.consultoria)>0).reduce((s,v)=>s+toNumber(v.consultoria),0);

  const origemCount={};
  associados.forEach(a=>{ const o=a.origem||"Outros"; origemCount[o]=(origemCount[o]||0)+1; });
  const vendasPorOrigem=Object.entries(origemCount).map(([name,value])=>({name,value}));

  const ultimosMeses=[]; { let m=mes; for(let i=0;i<12;i++){ ultimosMeses.unshift(m); m=prevMonth(m);} }
  const series=ultimosMeses.map(m=>{
    const fin=computeFinanceiroMes(vendas,producaoEquipe,indicacoes,config,m,consultores);
    const vendasDoMesArr=vendasDoMes(vendas,m);
    return {mes:monthLabel(m),receita:fin.totalPrevisto,vendasQtd:vendasDoMesArr.length,recorrencia:fin.recorrenciaPrevista,consultoria:fin.consultoriaPrevista,producaoPessoal:fin.producaoPessoal,producaoEquipe:fin.producaoEquipeTotal};
  });

  const hoje=new Date().toISOString().slice(0,10);
  const vendasAtivasHoje=vendas.filter(v=>v.status==="Ativa"&&v.data);
  const vendasComData=vendas.filter(v=>v.data);
  const carteiraPorMes=ultimosMeses.map(m=>({mes:monthLabel(m),totalVendas:vendasComData.filter(v=>v.data<=`${m}-31`).length,placasAtivas:vendasAtivasHoje.filter(v=>v.data<=`${m}-31`).length}));

  const n=series.length;
  const ultimo=series[n-1], penultimo=series[n-2];
  const insightReceita=ultimo&&penultimo?trendText(ultimo.receita,penultimo.receita):"Ainda não há dados suficientes.";
  const insightVendas=ultimo&&penultimo?trendText(ultimo.vendasQtd,penultimo.vendasQtd):"Ainda não há dados suficientes.";
  const ultimos3Consultoria=series.slice(-3).map(s=>s.consultoria);
  const mediaConsultoria=ultimos3Consultoria.reduce((a,b)=>a+b,0)/(ultimos3Consultoria.length||1);
  const varConsultoria=ultimos3Consultoria.length===3?Math.max(...ultimos3Consultoria)-Math.min(...ultimos3Consultoria):Infinity;
  const insightConsultoria=ultimos3Consultoria.length<3?"Ainda não há dados suficientes.":(varConsultoria<=mediaConsultoria*0.1||mediaConsultoria===0?"A consultoria apresentou estabilidade nos últimos três meses.":trendText(ultimo.consultoria,penultimo.consultoria));
  const insightCarteira=carteiraPorMes.length?`Carteira ativa cresceu de ${carteiraPorMes[0]?.placasAtivas||0} para ${carteiraPorMes[carteiraPorMes.length-1].placasAtivas} placas, enquanto o total de vendas foi de ${carteiraPorMes[0]?.totalVendas||0} para ${carteiraPorMes[carteiraPorMes.length-1].totalVendas}.`:"Ainda não há dados suficientes.";
  const totalProducaoPessoal=series.reduce((s,x)=>s+x.producaoPessoal,0);
  const totalProducaoEquipe=series.reduce((s,x)=>s+x.producaoEquipe,0);
  const insightProducao=totalProducaoPessoal+totalProducaoEquipe>0?`A equipe responde por ${((totalProducaoEquipe/(totalProducaoPessoal+totalProducaoEquipe))*100).toFixed(0)}% da produção nos últimos ${n} meses.`:"Ainda não há dados suficientes.";
  const topOrigem=[...vendasPorOrigem].sort((a,b)=>b.value-a.value)[0];
  const totalOrigem=vendasPorOrigem.reduce((s,o)=>s+o.value,0);
  const insightOrigem=topOrigem&&totalOrigem?`${topOrigem.name} é a principal origem, com ${((topOrigem.value/totalOrigem)*100).toFixed(0)}% dos associados.`:"Ainda não há dados suficientes.";

  const planoAtual=computePlanoCarreiraDoMes(vendas,producaoEquipe,consultores,mes);
  const idxNivel=PLANO_FAIXAS.findIndex(f=>f.nivel===planoAtual.faixa.nivel);
  const proximoNivel=PLANO_FAIXAS[idxNivel+1];
  const evolucaoPct=proximoNivel?Math.min(100,(planoAtual.producaoTotal/proximoNivel.min)*100):100;
  const faltamProximoNivel=proximoNivel?Math.max(0,proximoNivel.min-planoAtual.producaoTotal):0;

  const aniversariantesHoje=associados.filter(a=>a.dataNascimento&&daysUntilBirthday(a.dataNascimento)===0);
  const boletosProximos=vendas.filter(v=>getPrimeiroBoleto(v)>=hoje&&getPrimeiroBoleto(v)<=addDays(hoje,7));
  const diasNoMes=new Date(Number(mes.slice(0,4)),Number(mes.slice(5,7)),0).getDate();
  const diaAtual=new Date().getDate();
  const metaEmRisco=metaMes&&percentualMeta!==null&&(diaAtual/diasNoMes)*100-percentualMeta>15;
  const pendencias=vendas.filter(v=>v.status==="Ativa Pendente");

  const lembretes=vendas.flatMap(v=>[
    {data:addDays(v.data,5),texto:`1º contato pós-venda — ${associadoNome(v.associadoId)} (placa ${v.veiculoPlaca||"—"})`},
    {data:getPrimeiroBoleto(v),texto:`2º contato — confirmar 1º boleto de ${associadoNome(v.associadoId)} (placa ${v.veiculoPlaca||"—"})`},
  ]).filter(l=>l.data);
  const tarefasHoje=lembretes.filter(l=>l.data===hoje);
  const lembretesProximos=lembretes.filter(l=>l.data>hoje&&l.data<=addDays(hoje,3));

  const alertas=[];
  if(aniversariantesHoje.length) alertas.push({tone:"green",texto:`${aniversariantesHoje.length} aniversariante(s) hoje: ${aniversariantesHoje.map(a=>a.nomeCompleto).join(", ")}`});
  if(tarefasHoje.length) alertas.push({tone:"green",texto:`${tarefasHoje.length} tarefa(s) de pós-venda para hoje`});
  if(lembretesProximos.length) alertas.push({tone:"amber",texto:`${lembretesProximos.length} lembrete(s) de pós-venda nos próximos 3 dias`});
  if(boletosProximos.length) alertas.push({tone:"amber",texto:`${boletosProximos.length} primeiro(s) boleto(s) vencendo nos próximos 7 dias`});
  datasCalendario.forEach(c=>{
    if(c.dataPagamento>=hoje&&c.dataPagamento<=addDays(hoje,7)) alertas.push({tone:"gray",texto:`Pagamento de ${c.label} previsto para ${formatDateBR(c.dataPagamento)}`});
    if(c.dataNf>=hoje&&c.dataNf<=addDays(hoje,3)) alertas.push({tone:"amber",texto:`Envio da nota fiscal de ${c.label} até ${formatDateBR(c.dataNf)}`});
  });
  if(!finPeriodo.consultoriaElegivel&&consultoriasAtivasValor>0) alertas.push({tone:"red",texto:"Consultoria especializada não elegível este mês — confira os requisitos no painel Financeiro"});
  if(metrics.consultoriasAtivas<CONSULTORIA_PLACAS_ATIVAS_MINIMAS) alertas.push({tone:"amber",texto:`Faltam ${CONSULTORIA_PLACAS_ATIVAS_MINIMAS-metrics.consultoriasAtivas} placa(s) com consultoria ativa para elegibilidade da Consultoria Especializada`});
  if(metrics.placasAtivas>=RECORRENCIA_BLOCO&&!finPeriodo.recorrenciaElegivel) alertas.push({tone:"amber",texto:`Faltam ${Math.max(0,RECORRENCIA_VENDAS_MINIMAS_MES-finPeriodo.placasVendidasMesAnterior)} venda(s) no mês anterior para elegibilidade da Recorrência`});
  if(proximoNivel) alertas.push({tone:"gray",texto:`Faltam ${faltamProximoNivel} placa(s) para o próximo nível do Plano de Carreira (${proximoNivel.nivel})`});
  if(metaEmRisco) alertas.push({tone:"red",texto:`Meta de ${monthLabel(mes)} em risco: ${percentualMeta.toFixed(0)}% concluído no dia ${diaAtual} de ${diasNoMes}`});
  if(metrics.inadimplentes>0) alertas.push({tone:"red",texto:`${metrics.inadimplentes} venda(s) com status Inadimplente`});
  if(pendencias.length) alertas.push({tone:"amber",texto:`${pendencias.length} venda(s) com status Ativa Pendente exigindo ação`});
  alertas.push({tone:"gray",texto:"Lembrete mensal: verifique a emissão das notas fiscais do período."});
  const ORDEM_TONE={red:0,amber:1,green:2,gray:3};
  alertas.sort((a,b)=>ORDEM_TONE[a.tone]-ORDEM_TONE[b.tone]);

  const html=`
  <div style="display:flex;flex-direction:column;gap:20px;">
    <div style="display:flex;justify-content:space-between;align-items:flex-end;flex-wrap:wrap;gap:12px;">
      <div><h1 style="margin:0;font-size:22px;font-weight:800;">Dashboard Financeiro</h1>
        <div style="font-size:13px;color:${MUTED};margin-top:4px;text-transform:capitalize;">${new Date(mes+"-01T00:00:00").toLocaleDateString("pt-BR",{month:"long",year:"numeric"})}</div></div>
      <label style="display:flex;flex-direction:column;gap:6px;"><span class="field-label">Período de análise</span>
        <input class="input" type="month" value="${mes}" data-action="setDashboardMes" /></label>
    </div>

    <div style="display:flex;gap:14px;flex-wrap:wrap;">
      ${kpiCard("cart","Adesões do mês",formatBRL(finPeriodo.adesoesMes),{sub:`${finPeriodo.totalAdesoesQtd} vendas`})}
      ${kpiCard("users","Carteira",`${metrics.totalPlacasVendidas} Associados`,{sub:`${metrics.placasAtivas} Ativos`,subTone:"up"})}
      ${kpiCard("usercog","Consultoria",formatBRL(finPeriodo.consultoriaPrevista),{sub:`${metrics.consultoriasAtivas} Consultorias Ativas`})}
      ${kpiCard("dollar","Total previsto",formatBRL(finPeriodo.totalPrevisto),{accent:RED_DARK,glow:true})}
    </div>

    <div class="grid-2col" style="align-items:start;">
      ${metaMes?`<div class="card">
        <div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:16px;">
          <h3 style="margin:0;font-size:16px;font-weight:800;text-transform:capitalize;">Meta de ${new Date(mes+"-01T00:00:00").toLocaleDateString("pt-BR",{month:"long"})}</h3>
          <span style="font-size:22px;font-weight:800;color:${RED}">${percentualMeta.toFixed(0)}%</span>
        </div>
        <div style="margin-bottom:14px;">
          <div style="display:flex;justify-content:space-between;font-size:12.5px;color:${MUTED};margin-bottom:6px;"><span>Barra financeira</span><span>${formatBRL(finPeriodo.totalPrevisto)} / ${formatBRL(toNumber(metaMes.metaFinanceira))}</span></div>
          <div style="height:10px;background:${SURFACE_ALT};border-radius:999px;overflow:hidden;"><div style="width:${Math.min(100,percentualMeta)}%;height:100%;background:${RED};"></div></div>
        </div>
        ${metaPlacasPct!==null?`<div style="margin-bottom:14px;">
          <div style="display:flex;justify-content:space-between;font-size:12.5px;color:${MUTED};margin-bottom:6px;"><span>Barra de produção</span><span>${placasRealizadasMes} Placas / ${toNumber(metaMes.metaPlacas)} Placas</span></div>
          <div style="height:10px;background:${SURFACE_ALT};border-radius:999px;overflow:hidden;"><div style="width:${metaPlacasPct}%;height:100%;background:#5B8DEF;"></div></div>
        </div>`:""}
        ${metaEquipePct!==null?`<div style="margin-bottom:16px;">
          <div style="display:flex;justify-content:space-between;font-size:12.5px;color:${MUTED};margin-bottom:6px;"><span>Meta de vendas da equipe</span><span>${producaoEquipeMesAtual} / ${toNumber(metaMes.metaVendas)} Placas · ${metaEquipePct.toFixed(0)}%</span></div>
          <div style="height:10px;background:${SURFACE_ALT};border-radius:999px;overflow:hidden;"><div style="width:${metaEquipePct}%;height:100%;background:${GREEN};"></div></div>
        </div>`:""}
        <div style="display:flex;gap:8px;">
          ${miniStat("Premiações",finPeriodo.premiacaoMensal+finPeriodo.premiacaoSemanal,dataDoMes(mes,CALENDARIO.premiacoes.pagamento))}
          ${miniStat("Consultoria",finPeriodo.consultoriaPrevista,dataDoMes(mes,CALENDARIO.consultoria.pagamento))}
          ${miniStat("Plano de carreira",finPeriodo.planoDeCarreiraPrevisto,dataDoMes(mes,CALENDARIO.planoDeCarreira.pagamento))}
        </div>
      </div>`:"<div></div>"}

      <div class="card ancore-card" style="border:2px solid ${RED};box-shadow:0 4px 24px rgba(0,0,0,.35), 0 0 28px rgba(219,57,55,.18);">
        <h3 class="section-title">Plano de carreira — mês atual</h3>
        <div style="display:flex;flex-wrap:wrap;gap:24px;align-items:center;margin-bottom:16px;">
          <div>
            <div style="font-size:12px;color:${MUTED}">${planoAtual.producaoTotal} placas em ${monthLabel(mes)} (pessoal ${planoAtual.producaoPessoal} + equipe ${planoAtual.producaoEquipeTotal})</div>
            <div style="font-size:24px;font-weight:800;color:${RED};text-transform:uppercase;">${esc(planoAtual.faixa.nivel)}</div>
            <div style="font-size:13px;color:${MUTED}">Premiação: <b style="color:${"var(--text)"}">${formatBRL(planoAtual.premiacaoLiberada)}</b></div>
          </div>
          ${proximoNivel?`<div style="margin-left:auto;text-align:right;">
            <div style="font-size:11px;color:${MUTED};text-transform:uppercase;letter-spacing:.05em;">Próximo nível</div>
            <div style="font-size:16px;font-weight:800;">${esc(proximoNivel.nivel)}</div>
            <div style="font-size:13px;color:${MUTED}">Premiação: <b>${formatBRL(proximoNivel.premiacao)}</b></div>
          </div>`:""}
        </div>
        ${proximoNivel?`<div style="display:flex;justify-content:space-between;font-size:12.5px;color:${MUTED};margin-bottom:6px;"><span>Evolução</span><span>${planoAtual.producaoTotal} / ${proximoNivel.min} Placas</span></div>
          <div style="height:10px;background:${SURFACE_ALT};border-radius:999px;overflow:hidden;"><div style="width:${evolucaoPct}%;height:100%;background:${RED};"></div></div>
          <div style="font-size:13px;margin-top:8px;">Faltam <b>${faltamProximoNivel}</b> placas para atingir o próximo nível.</div>`
          :`<div style="font-size:13px;color:${MUTED}">Nível máximo do Plano de Carreira já atingido.</div>`}
      </div>

      ${sectionCard("Alertas inteligentes",`<div style="display:flex;flex-direction:column;gap:8px;">${alertas.map(a=>`
        <div style="display:flex;align-items:center;gap:10px;padding:10px 14px;background:${SURFACE_ALT};border-radius:8px;font-size:13px;">
          ${badge(a.tone==='red'?'Ação':a.tone==='amber'?'Atenção':a.tone==='green'?'Hoje':'Info',a.tone)}<span>${esc(a.texto)}</span>
        </div>`).join("")}</div>`)}

      ${sectionCard("Tarefas do dia", tarefasHoje.length===0?`<div style="color:${MUTED};font-size:13px;padding:10px 0;">Nenhuma tarefa de pós-venda para hoje.</div>`:
        `<div style="display:flex;flex-direction:column;gap:8px;">${tarefasHoje.map(l=>`
          <div style="display:flex;align-items:center;gap:10px;padding:10px 14px;background:${SURFACE_ALT};border-radius:8px;font-size:13px;">${ic('clock',14,RED)}<span>${esc(l.texto)}</span></div>`).join("")}</div>`)}
    </div>

    <div class="grid-2col">
      ${sectionCard("Receita mensal",chartCanvas("chartReceita"),null,insightReceita)}
      ${sectionCard("Vendas por mês",chartCanvas("chartVendas"),null,insightVendas)}
      ${sectionCard("Evolução da consultoria",chartCanvas("chartConsultoria"),null,insightConsultoria)}
      ${sectionCard("Evolução da carteira",chartCanvas("chartCarteira"),null,insightCarteira)}
      ${sectionCard("Produção pessoal x equipe",chartCanvas("chartProducao"),null,insightProducao)}
      ${sectionCard("Vendas por origem",chartCanvas("chartOrigem"),null,insightOrigem)}
    </div>
  </div>`;

  DB._dashboardData={series,carteiraPorMes,vendasPorOrigem};
  return html;
}
function miniStat(label,valor,data){
  return `<div style="flex:1;background:${SURFACE_ALT};border-radius:8px;padding:10px 12px;min-width:0;">
    <div style="font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:${MUTED};margin-bottom:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${esc(label)}</div>
    <div style="font-size:14.5px;font-weight:800;">${formatBRL(valor)}</div>

const CHART_INSTANCES={};
function destroyChart(id){ if(CHART_INSTANCES[id]){ CHART_INSTANCES[id].destroy(); delete CHART_INSTANCES[id]; } }
function drawDashboardCharts(){
  if(!DB._dashboardData) return;
  const {series,carteiraPorMes,vendasPorOrigem}=DB._dashboardData;
  const muted=MUTED, silver=SILVER;
  const commonScales={x:{ticks:{color:muted,font:{size:11}},grid:{display:false}},y:{ticks:{color:muted,font:{size:10}},grid:{color:"#26272C"}}};
  const chartIds=["chartReceita","chartVendas","chartConsultoria","chartCarteira","chartProducao","chartOrigem"];
  chartIds.forEach(destroyChart);

  if(typeof Chart==="undefined"){
    console.error("Chart.js não carregou (biblioteca externa via CDN pode ter sido bloqueada pela rede/adblock).");
    chartIds.forEach(id=>{
      const canvas=document.getElementById(id);
      if(canvas && canvas.parentNode){
        canvas.parentNode.innerHTML=`<div style="color:${MUTED};font-size:12.5px;padding:20px;text-align:center;">Não foi possível carregar a biblioteca de gráficos (Chart.js). Verifique sua conexão ou bloqueador de anúncios e recarregue a página.</div>`;
      }
    });
    return;
  }

  function safeChart(id,builder){
    try{
      const canvas=document.getElementById(id);
      if(!canvas) return;
      CHART_INSTANCES[id]=builder(canvas);
    }catch(err){
      console.error("Erro ao desenhar gráfico",id,err);
      const canvas=document.getElementById(id);
      if(canvas && canvas.parentNode){
        canvas.parentNode.innerHTML=`<div style="color:${MUTED};font-size:12.5px;padding:20px;text-align:center;">Não foi possível desenhar este gráfico (${esc(err.message||String(err))}).</div>`;
      }
    }
  }

  safeChart("chartReceita",(c)=>new Chart(c,{type:"bar",data:{labels:series.map(s=>s.mes),datasets:[{data:series.map(s=>s.receita),backgroundColor:RED,borderRadius:4}]},options:{plugins:{legend:{display:false},tooltip:{callbacks:{label:(ctx)=>formatBRL(ctx.parsed.y)}}},scales:commonScales,responsive:true,maintainAspectRatio:false}}));

  safeChart("chartVendas",(c)=>new Chart(c,{type:"bar",data:{labels:series.map(s=>s.mes),datasets:[{data:series.map(s=>s.vendasQtd),backgroundColor:"#5B8DEF",borderRadius:4}]},options:{plugins:{legend:{display:false}},scales:commonScales,responsive:true,maintainAspectRatio:false}}));

  safeChart("chartConsultoria",(c)=>new Chart(c,{type:"line",data:{labels:series.map(s=>s.mes),datasets:[{data:series.map(s=>s.consultoria),borderColor:GREEN,backgroundColor:GREEN,tension:.3,pointRadius:0,borderWidth:2.5}]},options:{plugins:{legend:{display:false},tooltip:{callbacks:{label:(ctx)=>formatBRL(ctx.parsed.y)}}},scales:commonScales,responsive:true,maintainAspectRatio:false}}));

  safeChart("chartCarteira",(c)=>new Chart(c,{type:"line",data:{labels:carteiraPorMes.map(s=>s.mes),datasets:[
    {label:"Total de vendas",data:carteiraPorMes.map(s=>s.totalVendas),borderColor:"#5B8DEF",backgroundColor:"#5B8DEF",tension:.3,pointRadius:0,borderWidth:2.5},
    {label:"Placas ativas",data:carteiraPorMes.map(s=>s.placasAtivas),borderColor:RED,backgroundColor:RED,tension:.3,pointRadius:0,borderWidth:2.5},
  ]},options:{plugins:{legend:{labels:{color:muted,font:{size:12}}}},scales:commonScales,responsive:true,maintainAspectRatio:false}}));

  safeChart("chartProducao",(c)=>new Chart(c,{type:"bar",data:{labels:series.map(s=>s.mes),datasets:[
    {label:"Pessoal",data:series.map(s=>s.producaoPessoal),backgroundColor:RED,borderRadius:4},
    {label:"Equipe",data:series.map(s=>s.producaoEquipe),backgroundColor:"#5B8DEF",borderRadius:4},
  ]},options:{plugins:{legend:{labels:{color:muted,font:{size:12}}}},scales:commonScales,responsive:true,maintainAspectRatio:false}}));

  if(vendasPorOrigem.length>0){
    safeChart("chartOrigem",(c)=>new Chart(c,{type:"pie",data:{labels:vendasPorOrigem.map(o=>o.name),datasets:[{data:vendasPorOrigem.map(o=>o.value),backgroundColor:PIE_COLORS}]},options:{plugins:{legend:{position:"bottom",labels:{color:muted,font:{size:12}}}},responsive:true,maintainAspectRatio:false}}));
  }
}

/* ---------------- METAS ---------------- */
function renderMetas(){
  const sorted=[...DB.metas].sort((a,b)=>(b.periodo||"").localeCompare(a.periodo||""));
  const columns=[
    {key:"periodo",label:"Período",render:r=>`<b>${r.tipo==="mensal"?monthLabel(r.periodo):esc(r.periodo)}</b>`},
    {key:"tipo",label:"Tipo",render:r=>esc(r.tipo)},
    {key:"metaFinanceira",label:"Meta financeira",render:r=>formatBRL(toNumber(r.metaFinanceira))},
    {key:"metaVendas",label:"Meta de vendas",render:r=>esc(r.metaVendas||"")},
    {key:"metaPlacas",label:"Meta de placas",render:r=>esc(r.metaPlacas||"")},
    {key:"progresso",label:"Progresso",render:r=>{
      if(r.tipo!=="mensal") return "—";
      const fin=computeFinanceiroMes(DB.vendas,DB.producaoEquipe,DB.indicacoes,DB.config,r.periodo,DB.equipe);
      const pct=toNumber(r.metaFinanceira)?(fin.totalPrevisto/toNumber(r.metaFinanceira))*100:0;
      return `${pct.toFixed(0)}%`;

  return `<div style="display:flex;flex-direction:column;gap:16px;">

  </div>`;
}

function renderEquipe(){
  const cm=currentMonth();
  const producaoMes=DB.producaoEquipe.filter(p=>p.competencia===cm);
  const consultoresAtivos=DB.equipe.filter(c=>c.status==="Ativo");
  const totalPlacasEquipe=producaoMes.reduce((s,p)=>s+toNumber(p.placasVendidas),0);
  const mediaPorConsultor=consultoresAtivos.length?totalPlacasEquipe/consultoresAtivos.length:0;
  const selecionadosCount=DB.equipe.filter(c=>c.selecionadoPlanoCarreira).length;
  const ranking=[...producaoMes].sort((a,b)=>toNumber(b.placasVendidas)-toNumber(a.placasVendidas));
  const abaixoDaMedia=producaoMes.filter(p=>toNumber(p.placasVendidas)<mediaPorConsultor).map(p=>({...p,_nome:consultorNome(p.consultorId)})).sort((a,b)=>toNumber(a.placasVendidas)-toNumber(b.placasVendidas));

  const columnsConsultores=[
    {key:"selecionadoPlanoCarreira",label:"Plano de carreira",render:r=>`<input type="checkbox" style="width:16px;height:16px;cursor:pointer;" data-action="toggleSelecionado" data-id="${r.id}" ${r.selecionadoPlanoCarreira?'checked':''} />`},

    {key:"dataEntrada",label:"Data de entrada",render:r=>formatDateBR(r.dataEntrada)},
    {key:"telefone",label:"Telefone",render:r=>esc(r.telefone||"")},
  ];
  const columnsProducao=[
    {key:"competencia",label:"Competência",render:r=>`<b>${monthLabel(r.competencia)}</b>`},
    {key:"consultor",label:"Consultor",render:r=>esc(consultorNome(r.consultorId))},
    {key:"placasVendidas",label:"Placas vendidas",render:r=>esc(r.placasVendidas||"")},
    {key:"placasAtivas",label:"Placas ativas",render:r=>esc(r.placasAtivas||"")},
    {key:"elegivel",label:"Elegível (≥3)",render:r=>badge(toNumber(r.placasVendidas)>=EQUIPE_VENDAS_MIN_POR_PESSOA?"Sim":"Não",toNumber(r.placasVendidas)>=EQUIPE_VENDAS_MIN_POR_PESSOA?"green":"amber")},
  ];

  return `<div style="display:flex;flex-direction:column;gap:20px;">

      ${kpiCard("usercog","Consultores ativos",consultoresAtivos.length)}

    </div>
    ${sectionCard("Abaixo da média", abaixoDaMedia.length===0?emptyNote("Nenhum consultor abaixo da média da equipe este mês."):
      `<div style="display:flex;flex-direction:column;gap:8px;">${abaixoDaMedia.map(p=>`
        <div style="display:flex;justify-content:space-between;align-items:center;padding:10px 14px;background:${SURFACE_ALT};border-radius:8px;font-size:13px;">
          <span><b>${esc(p._nome)}</b></span><span>${p.placasVendidas} venda(s) · média da equipe: ${mediaPorConsultor.toFixed(1)}</span>

function renderRelatorios(){

    (!f.origem||associadoOrigem(v.associadoId)===f.origem)&&

    {key:"plano",label:"Plano",render:r=>esc(r.plano||"")},

    {key:"valorAdesao",label:"Adesão",render:r=>formatBRL(toNumber(r.valorAdesao))},
  ];
  return `<div style="display:flex;flex-direction:column;gap:18px;">
    ${sectionCard("Filtros",`<div class="grid-3col">
      <label style="display:flex;flex-direction:column;gap:6px;"><span class="field-label">Origem</span><select class="input" data-action="relOrigem"><option value="">Selecionar…</option>${ORIGEM_OPTS.map(o=>`<option value="${esc(o)}" ${f.origem===o?'selected':''}>${esc(o)}</option>`).join("")}</select></label>

      <label style="display:flex;flex-direction:column;gap:6px;"><span class="field-label">Contrato de</span><input class="input" type="date" value="${f.inicio}" data-action="relInicio" /></label>
      <label style="display:flex;flex-direction:column;gap:6px;"><span class="field-label">Contrato até</span><input class="input" type="date" value="${f.fim}" data-action="relFim" /></label>

      ${sectionCard("Ranking de planos", Object.keys(porPlano).length===0?emptyNote("Sem dados."):`<div style="display:flex;flex-direction:column;gap:8px;">${Object.entries(porPlano).sort((a,b)=>b[1]-a[1]).map(([k,v])=>`<div style="display:flex;justify-content:space-between;font-size:13px;"><span>${esc(k)}</span><b>${v}</b></div>`).join("")}</div>`)}

/* ---------------- BACKUP: EXPORTAR / IMPORTAR ---------------- */
function exportBackup(){
  const backup={
    _tipo:"ancore-crm-backup", _versao:1, _exportadoEm:new Date().toISOString(),
    associados:DB.associados, vendas:DB.vendas, despesas:DB.despesas, metas:DB.metas,
    indicacoes:DB.indicacoes, equipe:DB.equipe, producaoEquipe:DB.producaoEquipe, config:DB.config,
  };
  const blob=new Blob([JSON.stringify(backup,null,2)],{type:"application/json"});
  const url=URL.createObjectURL(blob);
  const a=document.createElement("a");
  const dataStr=new Date().toISOString().slice(0,10);
  a.href=url; a.download=`ancore-backup-${dataStr}.json`;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}
async function importBackupFromFile(file){
  const statusEl=document.getElementById("importStatusMsg");
  try{
    const text=await file.text();
    const parsed=JSON.parse(text);
    // Aceita tanto o formato { associados:[...], vendas:[...], ... }
    // quanto o formato { sistema, exportadoEm, dados:{ associados:[...], vendas:[...], ... } }
    const data = (parsed && parsed.dados && typeof parsed.dados==="object") ? parsed.dados : parsed;
    if(!data || typeof data!=="object"){ throw new Error("Arquivo inválido."); }
    const map={associados:"associados",vendas:"vendas",despesas:"despesas",metas:"metas",indicacoes:"indicacoes",equipe:"equipe",producaoEquipe:"producaoEquipe"};
    const resumo=[];
    for(const collName of Object.keys(map)){
      if(Array.isArray(data[collName])){
        await persist(collName,data[collName]);
        resumo.push(`${collName}: ${data[collName].length}`);
      }
    }
    if(data.config && typeof data.config==="object") await persistConfig({...DEFAULT_CONFIG,...data.config});
    if(statusEl) statusEl.innerHTML=`<span style="color:${GREEN}">Dados importados com sucesso! (${resumo.join(" · ")})</span>`;
    rerender();
  }catch(e){
    console.error("Erro ao importar backup",e);
    if(statusEl) statusEl.innerHTML=`<span style="color:${RED_DARK}">Não foi possível importar este arquivo. Verifique se é um backup gerado por este sistema.</span>`;
    else alert("Não foi possível importar este arquivo.");
  }
}

  DB.associados.forEach(a=>{ if([a.nomeCompleto,a.cpf,a.telefone,a.email].some(v=>(v||"").toLowerCase().includes(q))) hits.push({type:"Associado",label:a.nomeCompleto,assocId:a.id}); });

}

/* ---------------- EVENT DELEGATION ---------------- */
document.addEventListener("click",function(e){
  const t=e.target.closest("[data-action]");
  if(!t) return;
  const action=t.getAttribute("data-action");

  if(action==="overlayClose"){ if(e.target===t) closeModal(); return; }
  if(action==="closeModal"){ closeModal(); return; }
  if(action==="toggleSidebar"){ UI.sidebarOpen=!UI.sidebarOpen; rerender(); return; }
  if(action==="setTab"){ UI.tab=t.getAttribute("data-tab"); UI.selectedAssociadoId=null; rerender(); return; }
  if(action==="globalResultClick"){
    const idx=parseInt(t.getAttribute("data-idx"),10);
    const r=DB._globalResults[idx];
    if(r){ if(r.assocId){ UI.tab="carteira"; UI.selectedAssociadoId=r.assocId; } else if(r.goVendas){ UI.tab="vendas"; } UI.globalQuery=""; rerender(); }
    return;
  }

  /* Carteira */
  if(action==="novoAssociado"){ openModal({kind:"crud",title:"Novo associado",schema:ASSOCIADO_SCHEMA,draft:{},coll:"associados",requiredKey:"nomeCompleto",wide:true}); return; }
  if(action==="voltarCarteira"){ UI.selectedAssociadoId=null; rerender(); return; }
  if(t.closest("tr[data-table='carteira']") && action==="rowclick"){}
  if(action==="rowclick" && t.getAttribute("data-table")==="carteira"){ UI.selectedAssociadoId=t.getAttribute("data-id"); rerender(); return; }

  /* Ficha */
  if(action==="novaVendaFicha"){ openModal({kind:"crud",title:"Nova venda",schema:VENDA_SCHEMA,draft:{associadoId:t.getAttribute("data-id")},coll:"vendas",requiredKey:"associadoId",wide:true,extra:"vendaDocs"}); return; }
  if(action==="editVendaFicha"){ const v=DB.vendas.find(x=>x.id===t.getAttribute("data-id")); openModal({kind:"crud",title:"Editar venda",schema:VENDA_SCHEMA,draft:{...v},coll:"vendas",requiredKey:"associadoId",wide:true,extra:"vendaDocs"}); return; }
  if(action==="fichaAddContato"){
    const id=t.getAttribute("data-id"); const nota=(UI.fichaNovaNota||"").trim();
    if(!nota) return;
    const a=DB.associados.find(x=>x.id===id);
    const contatos=a.contatos||[];
    collSave("associados",{...a,contatos:[{data:new Date().toISOString().slice(0,10),nota},...contatos]});
    UI.fichaNovaNota="";
    return;
  }

  /* Generic table actions (edit/delete/pagination) */
  const table=t.getAttribute("data-table");
  if(action==="edit" && table){ handleTableEdit(table,t.getAttribute("data-id")); return; }
  if(action==="delete" && table){ handleTableDelete(table,t.getAttribute("data-id")); return; }
  if(action==="pagePrev" && table){ UI.page[table]=Math.max(0,(UI.page[table]||0)-1); rerender(); return; }
  if(action==="pageNext" && table){ UI.page[table]=(UI.page[table]||0)+1; rerender(); return; }

  /* Vendas tab */
  if(action==="novaVenda"){ if(DB.associados.length===0){ alert("Cadastre um associado na Carteira antes de lançar uma venda."); return; } openModal({kind:"crud",title:"Nova venda",schema:VENDA_SCHEMA,draft:{},coll:"vendas",requiredKey:"associadoId",wide:true,extra:"vendaDocs"}); return; }
  if(action==="toggleFiltrosVendas"){ UI.vendas.showFiltros=!UI.vendas.showFiltros; rerender(); return; }
  if(action==="abrirAssociadoDaVenda"){ UI.tab="carteira"; UI.selectedAssociadoId=t.getAttribute("data-id"); rerender(); return; }

  /* Financeiro */
  if(action==="novaDespesa"){ openModal({kind:"crud",title:"Lançar despesas/outras receitas",schema:DESPESA_SCHEMA,draft:{},coll:"despesas",requiredKey:"competencia"}); return; }

  /* Equipe */
  if(action==="novoConsultor"){ openModal({kind:"crud",title:"Novo consultor",schema:CONSULTOR_SCHEMA,draft:{},coll:"equipe",requiredKey:"nome",wide:true}); return; }
  if(action==="novaProducao"){
    if(DB.equipe.length===0){ alert("Cadastre um consultor antes de lançar produção."); return; }
    openModal({kind:"crud",title:"Lançar produção mensal",schema:PRODUCAO_SCHEMA,draft:{},coll:"producaoEquipe",requiredKey:"consultorId",wide:true});
    return;
  }
  if(action==="toggleSelecionado"){
    const c=DB.equipe.find(x=>x.id===t.getAttribute("data-id"));
    const jaSelecionados=DB.equipe.filter(x=>x.selecionadoPlanoCarreira&&x.id!==c.id);
    if(!c.selecionadoPlanoCarreira && jaSelecionados.length>=2){ alert('Só é possível manter 2 consultores selecionados para o Plano de Carreira. Desmarque um antes de selecionar outro.'); rerender(); return; }
    collSave("equipe",{...c,selecionadoPlanoCarreira:!c.selecionadoPlanoCarreira});
    return;
  }

  /* Metas */
  if(action==="novaMeta"){ openModal({kind:"meta",draft:{tipo:"mensal",periodo:currentMonth()}}); return; }
  if(action==="saveMeta"){
    const d=UI.modal.draft;
    if(!d.periodo) return;
    collSave("metas",d); closeModal(); return;
  }

  /* Indicações */
  if(action==="novaIndicacao"){ openModal({kind:"indicacao",draft:{},modoManual:false}); return; }
  if(action==="indModo"){ UI.modal.modoManual = t.getAttribute("data-val")==="1"; rerender(); return; }
  if(action==="saveIndicacao"){
    const d=UI.modal.draft, modoManual=UI.modal.modoManual;
    const ok = d.indicadorId && (modoManual ? (d.indicadoNomeManual||"").trim() : d.indicadoId);
    if(!ok) return;
    const finalData = modoManual ? {...d,indicadoId:""} : {...d,indicadoNomeManual:"",indicadoTelefoneManual:""};
    collSave("indicacoes",finalData); closeModal(); return;
  }

  /* Aniversariantes */
  if(action==="toggleOnlyWeek"){ UI.aniversariantes.onlyWeek=!UI.aniversariantes.onlyWeek; rerender(); return; }

  /* Relatorios */
  if(action==="exportRelatorio"){
    const reg=DB._tableRegistry&&DB._tableRegistry["relatorios"];
    const rows=(reg?reg.rows:[]).map(v=>({data:v.data,associado:associadoNome(v.associadoId),placa:v.veiculoPlaca,plano:v.plano,status:v.status,adesao:toNumber(v.valorAdesao),consultoria:toNumber(v.consultoria)}));
    exportXLSX(rows,"ancore-relatorio-vendas.xlsx","Vendas");
    return;
  }
  if(action==="printRelatorio"){ window.print(); return; }

  /* Backup */
  if(action==="exportBackup"){ exportBackup(); return; }

  /* CRUD modal generic save */
  if(action==="saveCrud"){
    const m=UI.modal;
    if(m.requiredKey && !(m.draft[m.requiredKey]||"").toString().trim()) return;
    if(m.coll==="despesas"){
      const existing=DB.despesas.find(x=>x.competencia===m.draft.competencia && x.id!==m.draft.id);
      collSave("despesas",{...m.draft, id:m.draft.id||(existing&&existing.id)});
    }else if(m.coll==="producaoEquipe"){
      const existing=DB.producaoEquipe.find(x=>x.competencia===m.draft.competencia && x.consultorId===m.draft.consultorId && x.id!==m.draft.id);
      collSave("producaoEquipe",{...m.draft, id:m.draft.id||(existing&&existing.id)});
    }else{
      collSave(m.coll, m.draft);
    }
    closeModal();
    return;
  }

  /* documentos field add/remove */
  if(action==="docAdd"){
    const ns=t.getAttribute("data-ns");
    const draft=UI.docDrafts[ns]||{tipo:"",nome:""};
    if(!(draft.nome||"").trim()) return;
    const novo={tipo:draft.tipo,nome:draft.nome,data:new Date().toISOString().slice(0,10)};
    if(ns==="vendaDocs"){
      const list=UI.modal.draft.documentosVeiculo||[];
      UI.modal.draft.documentosVeiculo=[novo,...list];
    }else if(ns.startsWith("assocDocs-")){
      const id=ns.replace("assocDocs-","");
      const a=DB.associados.find(x=>x.id===id);
      const list=a.documentos||[];
      collSave("associados",{...a,documentos:[novo,...list]});
    }
    UI.docDrafts[ns]={tipo:draft.tipo,nome:""};
    rerender();
    return;
  }
  if(action==="docRemove"){
    const ns=t.getAttribute("data-ns"); const idx=parseInt(t.getAttribute("data-idx"),10);
    if(ns==="vendaDocs"){
      const list=UI.modal.draft.documentosVeiculo||[];
      UI.modal.draft.documentosVeiculo=list.filter((_,i)=>i!==idx);
    }else if(ns.startsWith("assocDocs-")){
      const id=ns.replace("assocDocs-","");
      const a=DB.associados.find(x=>x.id===id);
      const list=(a.documentos||[]).filter((_,i)=>i!==idx);
      collSave("associados",{...a,documentos:list});
      return;
    }
    rerender();
    return;
  }
});

  if(kind==="indfield"){ UI.modal.draft[t.getAttribute("data-field")]=t.value; return; }

  if(action==="docTipo"){ const ns=t.getAttribute("data-ns"); UI.docDrafts[ns]=UI.docDrafts[ns]||{}; UI.docDrafts[ns].tipo=t.value; return; }
  if(action==="docNome"){ const ns=t.getAttribute("data-ns"); UI.docDrafts[ns]=UI.docDrafts[ns]||{}; UI.docDrafts[ns].nome=t.value; return; }
});

document.addEventListener("change",function(e){
  const t=e.target;
  const action=t.getAttribute("data-action");
  if(action==="importBackupFile"){
    const file=t.files&&t.files[0];
    if(file) importBackupFromFile(file);
    return;
  }
  if(["carteiraOrigem","vendasStatus","vendasOrigem","vendasPlano","relOrigem","relPlano","relStatus","setCargo"].includes(action)){ /* handled in input already for selects triggers change too - noop */ }
});

document.addEventListener("click",function(e){
  const th=e.target.closest("th[data-sortkey]");
  if(!th) return;
  const table=th.getAttribute("data-table"); const key=th.getAttribute("data-sortkey");
  const cur=UI.sort[table];
  UI.sort[table]=(cur&&cur.key===key)?{key,dir:cur.dir==="asc"?"desc":"asc"}:{key,dir:"asc"};
  rerender();
});

function handleTableEdit(table,id){
  if(table==="carteira"){ const a=DB.associados.find(x=>x.id===id); openModal({kind:"crud",title:"Editar associado",schema:ASSOCIADO_SCHEMA,draft:{...a},coll:"associados",requiredKey:"nomeCompleto",wide:true}); }
  else if(table==="vendas"){ const v=DB.vendas.find(x=>x.id===id); openModal({kind:"crud",title:"Editar venda",schema:VENDA_SCHEMA,draft:{...v},coll:"vendas",requiredKey:"associadoId",wide:true,extra:"vendaDocs"}); }
  else if(table==="despesas"){ const d=DB.despesas.find(x=>x.id===id); openModal({kind:"crud",title:"Editar lançamento",schema:DESPESA_SCHEMA,draft:{...d},coll:"despesas",requiredKey:"competencia"}); }
  else if(table==="metas"){ const m=DB.metas.find(x=>x.id===id); openModal({kind:"meta",draft:{...m}}); }
  else if(table==="indicacoes"){ const i=DB.indicacoes.find(x=>x.id===id); openModal({kind:"indicacao",draft:{...i},modoManual:!i.indicadoId&&!!i.indicadoNomeManual}); }
  else if(table==="consultores"){ const c=DB.equipe.find(x=>x.id===id); openModal({kind:"crud",title:"Editar consultor",schema:CONSULTOR_SCHEMA,draft:{...c},coll:"equipe",requiredKey:"nome",wide:true}); }
  else if(table==="producao"){ const p=DB.producaoEquipe.find(x=>x.id===id); openModal({kind:"crud",title:"Editar produção",schema:PRODUCAO_SCHEMA,draft:{...p},coll:"producaoEquipe",requiredKey:"consultorId",wide:true}); }
}
function handleTableDelete(table,id){
  if(table==="carteira"){
    const temVendas=DB.vendas.some(v=>v.associadoId===id);
    if(temVendas){ alert("Este associado possui vendas (placas) vinculadas e não pode ser excluído, para não perder o histórico. Remova ou reatribua as vendas primeiro."); return; }
    collRemove("associados",id);
  }else if(table==="vendas"){ collRemove("vendas",id); }
  else if(table==="despesas"){ collRemove("despesas",id); }
  else if(table==="metas"){ collRemove("metas",id); }
  else if(table==="indicacoes"){ collRemove("indicacoes",id); }
  else if(table==="consultores"){ collRemove("equipe",id); }
  else if(table==="producao"){ collRemove("producaoEquipe",id); }
}

/* ---------------- INIT ---------------- */
loadAll();
</script>
</body>
</html>
