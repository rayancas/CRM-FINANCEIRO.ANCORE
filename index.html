}

/* =================================================================
   VENDAS
================================================================= */
function Vendas({ vendas, associados, metrics, associadoNome, onNew, onEdit, onDelete, onOpenAssociado }) {
  const [search, setSearch] = useState("");
  const [statusFilter, setStatusFilter] = useState("");
  const [showFiltros, setShowFiltros] = useState(false);
  const [origemFilter, setOrigemFilter] = useState("");
  const [planoFilter, setPlanoFilter] = useState("");
  const [periodoInicio, setPeriodoInicio] = useState("");
  const [periodoFim, setPeriodoFim] = useState("");

  const associadoOrigem = (id) => associados.find((a) => a.id === id)?.origem || "";

  const filtered = useMemo(() => {
    const s = search.trim().toLowerCase();
    return vendas
      .filter((v) => !statusFilter || v.status === statusFilter)
      .filter((v) => !origemFilter || associadoOrigem(v.associadoId) === origemFilter)
      .filter((v) => !planoFilter || v.plano === planoFilter)
      .filter((v) => !periodoInicio || (v.data || "") >= periodoInicio)
      .filter((v) => !periodoFim || (v.data || "") <= periodoFim)
      .filter((v) => !s || [associadoNome(v.associadoId), v.veiculoPlaca, v.veiculoModelo, v.plano].some((x) => (x || "").toLowerCase().includes(s)))
      .sort((a, b) => (b.data || "").localeCompare(a.data || ""));
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [vendas, associados, search, statusFilter, origemFilter, planoFilter, periodoInicio, periodoFim]);

  const columns = [
    { key: "data", label: "Data", render: (r) => formatDateBR(r.data) },
    {
      key: "associado", label: "Associado", render: (r) => (
        <button onClick={(e) => { e.stopPropagation(); onOpenAssociado(r.associadoId); }} style={{ background: "none", border: "none", padding: 0, color: RED_DARK, fontWeight: 700, cursor: "pointer", textDecoration: "underline", fontSize: 13 }}>
          {associadoNome(r.associadoId)}
        </button>
      ),
    },
    {
      key: "veiculo", label: "Veículo", render: (r) => (
        <div><div>{r.veiculoModelo || "—"}</div><div style={{ fontSize: 11.5, color: MUTED, marginTop: 2 }}>{r.veiculoPlaca || "—"}</div></div>
      ),
    },
    { key: "plano", label: "Plano" },
    { key: "valorAdesao", label: "Adesão", render: (r) => formatBRL(toNumber(r.valorAdesao)) },
    { key: "consultoria", label: "Consultoria", render: (r) => formatBRL(toNumber(r.consultoria)) },
    {
      key: "mensalidade", label: "Mensalidade", render: (r) => (
        <div><div>{formatBRL(toNumber(r.primeiraMensalidade))}</div><div style={{ fontSize: 11.5, color: MUTED, marginTop: 2 }}>{formatDateBR(getPrimeiroBoleto(r))}</div></div>
      ),
    },
    { key: "status", label: "Status", render: (r) => <Badge text={r.status || "—"} tone={statusTone(r.status)} /> },
  ];

  return (
    <div style={{ display: "flex", flexDirection: "column", gap: 16 }}>
      <div style={{ display: "flex", gap: 14, flexWrap: "wrap" }}>
        <KpiCard icon={CarFront} label="Total de placas vendidas" value={metrics.totalPlacasVendidas} />
        <KpiCard icon={CheckCircle2} label="Total de placas ativas" value={metrics.placasAtivas} accent={RED_DARK} />
      </div>

      <div style={{ display: "flex", justifyContent: "space-between", gap: 12, flexWrap: "wrap" }}>
        <div style={{ display: "flex", gap: 10, flex: 1, flexWrap: "wrap" }}>
          <div style={{ position: "relative", flex: 1, minWidth: 220, maxWidth: 320 }}>
            <Search size={15} style={{ position: "absolute", left: 12, top: 11, color: "#9AA0A6" }} />
            <TextInput placeholder="Associado, placa, modelo, plano…" value={search} onChange={(e) => setSearch(e.target.value)} style={{ paddingLeft: 34 }} />
          </div>
          <Select options={VENDA_STATUS_OPTS} value={statusFilter} onChange={(e) => setStatusFilter(e.target.value)} style={{ maxWidth: 180 }} />
          <button onClick={() => setShowFiltros((s) => !s)} style={btnGhost}><Filter size={14} /> Filtros avançados</button>
        </div>
        <button style={btnPrimary} onClick={onNew}><Plus size={15} /> Nova venda</button>
      </div>

      {showFiltros && (
        <div className="grid-3col" style={{ background: SURFACE, borderRadius: 12, border: `1px solid ${SILVER}`, padding: 16, display: "grid", gridTemplateColumns: "repeat(4, 1fr)", gap: 12 }}>
          <Field label="Origem"><Select options={ORIGEM_OPTS} value={origemFilter} onChange={(e) => setOrigemFilter(e.target.value)} /></Field>
          <Field label="Plano"><Select options={PLANO_OPTS} value={planoFilter} onChange={(e) => setPlanoFilter(e.target.value)} /></Field>
          <Field label="Data de"><TextInput type="date" value={periodoInicio} onChange={(e) => setPeriodoInicio(e.target.value)} /></Field>
          <Field label="Data até"><TextInput type="date" value={periodoFim} onChange={(e) => setPeriodoFim(e.target.value)} /></Field>
        </div>
      )}

      <div style={{ maxHeight: "70vh", overflowY: "auto", borderRadius: 12 }}>
        <DataTable columns={columns} rows={filtered} onEdit={onEdit} onDelete={onDelete} emptyText="Nenhuma venda encontrada." sortable />
      </div>
    </div>
  );
}


/* =================================================================
   METAS
================================================================= */
function IndicacaoModal({ initial, associadoOptions, onSave, onCancel }) {
  const [data, setData] = useState(initial || {});
  const [modoManual, setModoManual] = useState(!initial?.indicadorId && !initial?.id ? false : !!(initial && !initial.indicadoId && (initial.indicadoNomeManual)));
  const set = (k) => (e) => setData((s) => ({ ...s, [k]: e.target.value }));

  return (
    <Modal title={data.id ? "Editar indicação" : "Nova indicação"} onClose={onCancel} wide>
      <div style={{ display: "flex", flexDirection: "column", gap: 16 }}>
        <Field label="Associado que indicou">
          <LookupSelect options={associadoOptions} value={data.indicadorId} onChange={(v) => setData((s) => ({ ...s, indicadorId: v }))} />
        </Field>

        <div>
          <span style={{ fontSize: 11, fontWeight: 700, letterSpacing: "0.06em", textTransform: "uppercase", color: MUTED, display: "block", marginBottom: 8 }}>Novo associado indicado</span>
          <div style={{ display: "flex", gap: 8, marginBottom: 12 }}>
            <button onClick={() => setModoManual(false)} style={!modoManual ? btnPrimary : btnGhost}>Associado cadastrado</button>
            <button onClick={() => setModoManual(true)} style={modoManual ? btnPrimary : btnGhost}>Cadastro manual</button>
          </div>
          {!modoManual ? (
            <LookupSelect options={associadoOptions} value={data.indicadoId} onChange={(v) => setData((s) => ({ ...s, indicadoId: v }))} />
          ) : (
            <div className="grid-2col" style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 14 }}>
              <Field label="Nome do indicado" span={2}><TextInput value={data.indicadoNomeManual || ""} onChange={set("indicadoNomeManual")} /></Field>
              <Field label="Telefone (opcional)"><TextInput value={data.indicadoTelefoneManual || ""} onChange={set("indicadoTelefoneManual")} /></Field>
              <Field label="Observações (opcional)" span={2}><TextArea rows={2} value={data.indicadoObservacoesManual || ""} onChange={set("indicadoObservacoesManual")} /></Field>
              {initial?.indicadoNomeManual && (
                <div style={{ fontSize: 12, color: MUTED, gridColumn: "span 2" }}>Assim que esse indicado for cadastrado na Carteira, volte aqui e troque para "Associado cadastrado" para vincular — o histórico desta indicação é preservado.</div>
              )}
            </div>
          )}
        </div>

        <div className="grid-2col" style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 14 }}>
          <Field label="Data da indicação"><TextInput type="date" value={data.data || ""} onChange={set("data")} /></Field>
          <Field label="Valor da comissão (R$)"><TextInput type="number" step="0.01" value={data.valorComissao || ""} onChange={set("valorComissao")} /></Field>
          <Field label="Status"><Select options={INDIC_STATUS_OPTS} value={data.status || ""} onChange={set("status")} /></Field>
        </div>

        <div style={{ display: "flex", justifyContent: "flex-end", gap: 10 }}>
          <button onClick={onCancel} style={btnGhost}>Cancelar</button>
          <button
            onClick={() => (data.indicadorId && (modoManual ? (data.indicadoNomeManual || "").trim() : data.indicadoId)) && onSave(modoManual ? { ...data, indicadoId: "" } : { ...data, indicadoNomeManual: "", indicadoTelefoneManual: "", indicadoObservacoesManual: "" })}
            style={btnPrimary}
          ><Save size={15} /> Salvar</button>
        </div>
      </div>
    </Modal>
  );
}

function MetaModal({ initial, onSave, onCancel }) {

  const set = (k) => (e) => setData((s) => ({ ...s, [k]: e.target.value }));

      <div style={{ display: "flex", flexDirection: "column", gap: 16 }}>
        <div className="grid-2col" style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 14 }}>
          <Field label="Tipo"><Select options={["mensal", "anual"]} value={data.tipo} onChange={set("tipo")} /></Field>
          <Field label="Período">
            <TextInput type={data.tipo === "anual" ? "number" : "month"} placeholder={data.tipo === "anual" ? "2026" : undefined} value={data.periodo || ""} onChange={set("periodo")} />
          </Field>
          <Field label="Meta financeira (R$)"><TextInput type="number" value={data.metaFinanceira || ""} onChange={set("metaFinanceira")} /></Field>

          <Field label="Meta de placas"><TextInput type="number" value={data.metaPlacas || ""} onChange={set("metaPlacas")} /></Field>

        <div style={{ display: "flex", justifyContent: "flex-end", gap: 10 }}>
          <button onClick={onCancel} style={btnGhost}>Cancelar</button>

  );
}

function Metas({ metas, vendas, producaoEquipe, indicacoes, config, consultores, metrics, onNew, onEdit, onDelete }) {
  const sorted = [...metas].sort((a, b) => (b.periodo || "").localeCompare(a.periodo || ""));
  const columns = [
    { key: "periodo", label: "Período", render: (r) => <b>{r.tipo === "mensal" ? monthLabel(r.periodo) : r.periodo}</b> },
    { key: "tipo", label: "Tipo" },
    { key: "metaFinanceira", label: "Meta financeira", render: (r) => formatBRL(toNumber(r.metaFinanceira)) },
    { key: "metaVendas", label: "Meta de vendas" },
    { key: "metaPlacas", label: "Meta de placas" },
    {
      key: "progresso", label: "Progresso", render: (r) => {
        if (r.tipo !== "mensal") return "—";
        const fin = computeFinanceiroMes(vendas, producaoEquipe, indicacoes, config, r.periodo, consultores);
        const pct = toNumber(r.metaFinanceira) ? (fin.totalPrevisto / toNumber(r.metaFinanceira)) * 100 : 0;
        return `${pct.toFixed(0)}%`;
      },
    },
  ];
  return (
    <div style={{ display: "flex", flexDirection: "column", gap: 16 }}>
      <div style={{ display: "flex", justifyContent: "flex-end" }}>
        <button style={btnPrimary} onClick={onNew}><Plus size={15} /> Nova meta</button>
      </div>
      <DataTable columns={columns} rows={sorted} onEdit={onEdit} onDelete={onDelete} emptyText="Nenhuma meta cadastrada." />
    </div>
  );
}

/* =================================================================
   RECORRÊNCIA
================================================================= */
function Recorrencia({ vendas, producaoEquipe, indicacoes, config, consultores, associadoNome, metrics }) {
  const [mes, setMes] = useState(currentMonth());
  const fin = useMemo(() => computeFinanceiroMes(vendas, producaoEquipe, indicacoes, config, mes, consultores), [vendas, producaoEquipe, indicacoes, config, mes, consultores]);
  const ativas = vendas.filter((v) => v.status === "Ativa");
  const columns = [
    { key: "associado", label: "Associado", render: (r) => <b>{associadoNome(r.associadoId)}</b> },
    { key: "veiculoPlaca", label: "Placa" },
    { key: "status", label: "Status", render: (r) => <Badge text={r.status} tone={statusTone(r.status)} /> },
    { key: "primeiroBoleto", label: "Próximo boleto", render: (r) => formatDateBR(getPrimeiroBoleto(r)) },
    { key: "data", label: "Tempo de carteira", render: (r) => `${monthsBetween(r.data)} meses` },
  ];
  return (
    <div style={{ display: "flex", flexDirection: "column", gap: 20 }}>
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", flexWrap: "wrap", gap: 12 }}>
        <div style={{ display: "flex", gap: 14, flexWrap: "wrap" }}>
          <KpiCard icon={Repeat} label="Recorrência prevista" value={formatBRL(fin.recorrenciaPrevista)} />
          <KpiCard icon={CarFront} label="Placas ativas" value={metrics.placasAtivas} accent={RED_DARK} />
          <KpiCard icon={AlertTriangle} label="Cancelamentos" value={metrics.cancelados} accent={AMBER} />
        </div>
        <Field label="Competência"><TextInput type="month" value={mes} onChange={(e) => setMes(e.target.value)} /></Field>
      </div>

      <SectionCard title="Elegibilidade de recorrência (regra Ancore)">
        <div style={{ display: "flex", flexDirection: "column", gap: 10, fontSize: 13.5 }}>
          <div>Vendas pessoais em {monthLabel(fin.mesAnterior)}: <b>{fin.placasVendidasMesAnterior}</b> (mínimo exigido: {RECORRENCIA_VENDAS_MINIMAS_MES})</div>
          <div>Placas ativas em {monthLabel(fin.mesAnterior)} (boletos pagos): <b>{fin.placasAtivasMesAnterior}</b> (a cada {RECORRENCIA_BLOCO} → {formatBRL(RECORRENCIA_VALOR_POR_BLOCO)})</div>
          <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
            Elegível em {monthLabel(mes)}: {fin.recorrenciaElegivel ? <Badge text="Sim" tone="green" /> : <Badge text="Não" tone="red" />}
          </div>
          <div>Valor previsto de recorrência: <b style={{ color: RED_DARK }}>{formatBRL(fin.recorrenciaPrevista)}</b> ({fin.recorrenciaBlocos} bloco{fin.recorrenciaBlocos === 1 ? "" : "s"} de {RECORRENCIA_BLOCO})</div>
        </div>
      </SectionCard>

      <DataTable columns={columns} rows={ativas} emptyText="Nenhuma placa ativa no momento." />
    </div>
  );
}

/* =================================================================
   ANIVERSARIANTES
================================================================= */
function Aniversariantes({ associados }) {
  const [onlyWeek, setOnlyWeek] = useState(false);
  const withBday = associados
    .filter((a) => a.dataNascimento)
    .map((a) => ({ ...a, _dias: daysUntilBirthday(a.dataNascimento) }))
    .sort((a, b) => a._dias - b._dias)
    .filter((a) => !onlyWeek || a._dias <= 7);

  return (
    <div style={{ display: "flex", flexDirection: "column", gap: 16 }}>
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center" }}>
        <div style={{ fontSize: 13, color: MUTED }}>{withBday.length} aniversariante{withBday.length === 1 ? "" : "s"}</div>
        <button onClick={() => setOnlyWeek((s) => !s)} style={onlyWeek ? btnPrimary : btnGhost}><Gift size={15} /> Só esta semana</button>
      </div>
      {withBday.length === 0 ? (
        <div style={{ color: MUTED, fontSize: 13, padding: 30, textAlign: "center", background: SURFACE, borderRadius: 12, border: `1px solid ${SILVER}` }}>Nenhum aniversariante encontrado.</div>
      ) : (
        <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
          {withBday.map((a) => (
            <div key={a.id} style={{ display: "flex", justifyContent: "space-between", alignItems: "center", background: SURFACE, border: `1px solid ${SILVER}`, borderRadius: 10, padding: "12px 16px" }}>
              <div>
                <div style={{ fontWeight: 700, fontSize: 14 }}>{a.nomeCompleto}</div>
                <div style={{ fontSize: 12, color: MUTED }}>{formatDateBR(a.dataNascimento)} · faz {ageFromDate(a.dataNascimento) + 1} anos</div>
              </div>
              <div style={{ display: "flex", alignItems: "center", gap: 14 }}>
                <Badge text={a._dias === 0 ? "Hoje!" : `em ${a._dias} dia${a._dias === 1 ? "" : "s"}`} tone={a._dias <= 7 ? "green" : "gray"} />
                {a.telefone && (
                  <a href={waLink(a.telefone)} target="_blank" rel="noreferrer" style={{ ...btnGhost, textDecoration: "none" }}>
                    <MessageCircle size={14} /> WhatsApp
                  </a>
                )}
              </div>
            </div>
          ))}
        </div>
      )}
    </div>
  );
}

/* =================================================================
   INDICAÇÕES
================================================================= */
function Indicacoes({ indicacoes, associadoNome, onNew, onEdit, onDelete }) {
  const sorted = [...indicacoes].sort((a, b) => (b.data || "").localeCompare(a.data || ""));
  const columns = [
    { key: "indicadorId", label: "Quem indicou", render: (r) => <b>{associadoNome(r.indicadorId)}</b> },
    { key: "indicadoId", label: "Associado indicado", render: (r) => nomeDoIndicado(r, associadoNome) },
    { key: "data", label: "Data", render: (r) => formatDateBR(r.data) },
    { key: "valorComissao", label: "Valor da comissão", render: (r) => formatBRL(toNumber(r.valorComissao)) },
    { key: "status", label: "Status", render: (r) => <Badge text={r.status} tone={statusTone(r.status)} /> },
  ];
  return (
    <div style={{ display: "flex", flexDirection: "column", gap: 16 }}>
      <div style={{ display: "flex", justifyContent: "flex-end" }}>
        <button style={btnPrimary} onClick={onNew}><Plus size={15} /> Nova indicação</button>
      </div>
      <DataTable columns={columns} rows={sorted} onEdit={onEdit} onDelete={onDelete} emptyText="Nenhuma indicação registrada." />
    </div>
  );
}

/* =================================================================
   EQUIPE / PLANO DE CARREIRA
================================================================= */
function Equipe({ consultores, producao, consultorNome, onNewConsultor, onEditConsultor, onDeleteConsultor, onNewProducao, onEditProducao, onDeleteProducao, onToggleSelecionado }) {
  const cm = currentMonth();
  const producaoMes = producao.filter((p) => p.competencia === cm);
  const consultoresAtivos = consultores.filter((c) => c.status === "Ativo");
  const totalPlacasEquipe = producaoMes.reduce((s, p) => s + toNumber(p.placasVendidas), 0);
  const mediaPorConsultor = consultoresAtivos.length ? totalPlacasEquipe / consultoresAtivos.length : 0;
  const selecionadosCount = consultores.filter((c) => c.selecionadoPlanoCarreira).length;

  const ranking = [...producaoMes].sort((a, b) => toNumber(b.placasVendidas) - toNumber(a.placasVendidas));

  const abaixoDaMedia = producaoMes
    .filter((p) => toNumber(p.placasVendidas) < mediaPorConsultor)
    .map((p) => ({ ...p, _nome: consultorNome(p.consultorId) }))
    .sort((a, b) => toNumber(a.placasVendidas) - toNumber(b.placasVendidas));

  const columnsConsultores = [
    {
      key: "selecionadoPlanoCarreira", label: "Plano de carreira", render: (r) => (
        <input
          type="checkbox"
          checked={!!r.selecionadoPlanoCarreira}
          onChange={(e) => { e.stopPropagation(); onToggleSelecionado(r); }}
          onClick={(e) => e.stopPropagation()}
          style={{ width: 16, height: 16, cursor: "pointer" }}
        />
      ),
    },
    { key: "nome", label: "Nome", render: (r) => <b>{r.nome}</b> },
    { key: "cargo", label: "Cargo" },
    { key: "status", label: "Status", render: (r) => <Badge text={r.status} tone={statusTone(r.status)} /> },
    { key: "dataEntrada", label: "Data de entrada", render: (r) => formatDateBR(r.dataEntrada) },
    { key: "telefone", label: "Telefone" },
  ];
  const columnsProducao = [
    { key: "competencia", label: "Competência", render: (r) => <b>{monthLabel(r.competencia)}</b> },
    { key: "consultor", label: "Consultor", render: (r) => consultorNome(r.consultorId) },
    { key: "placasVendidas", label: "Placas vendidas" },
    { key: "placasAtivas", label: "Placas ativas" },
    { key: "elegivel", label: "Elegível (≥3)", render: (r) => <Badge text={toNumber(r.placasVendidas) >= EQUIPE_VENDAS_MIN_POR_PESSOA ? "Sim" : "Não"} tone={toNumber(r.placasVendidas) >= EQUIPE_VENDAS_MIN_POR_PESSOA ? "green" : "amber"} /> },
  ];

  return (
    <div style={{ display: "flex", flexDirection: "column", gap: 20 }}>
      <div style={{ display: "flex", gap: 14, flexWrap: "wrap" }}>
        <KpiCard icon={UserCog} label="Consultores ativos" value={consultoresAtivos.length} />
        <KpiCard icon={CarFront} label="Placas da equipe (mês)" value={totalPlacasEquipe} accent={RED_DARK} />
        <KpiCard icon={TrendingUp} label="Média por consultor" value={mediaPorConsultor.toFixed(1)} />
        <KpiCard icon={CheckCircle2} label="Selecionados p/ Plano de Carreira" value={`${selecionadosCount}/2`} accent={selecionadosCount === 2 ? GREEN : AMBER} />
      </div>

      <SectionCard title="Abaixo da média">
        {abaixoDaMedia.length === 0 ? <EmptyNote text="Nenhum consultor abaixo da média da equipe este mês." /> : (
          <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
            {abaixoDaMedia.map((p) => (
              <div key={p.id} style={{ display: "flex", justifyContent: "space-between", alignItems: "center", padding: "10px 14px", background: SURFACE_ALT, borderRadius: 8, fontSize: 13 }}>
                <span><b>{p._nome}</b></span>
                <span>{p.placasVendidas} venda(s) · média da equipe: {mediaPorConsultor.toFixed(1)}</span>
              </div>
            ))}
          </div>
        )}
      </SectionCard>

      <SectionCard title="Consultores" right={<button style={btnGhost} onClick={onNewConsultor}><Plus size={14} /> Novo consultor</button>}>
        <div style={{ fontSize: 12, color: MUTED, marginBottom: 10 }}>Marque exatamente 2 consultores para validar o requisito de equipe do Plano de Carreira.</div>
        <DataTable columns={columnsConsultores} rows={consultores} onEdit={onEditConsultor} onDelete={onDeleteConsultor} emptyText="Nenhum consultor cadastrado." />
      </SectionCard>

      <SectionCard title="Ranking de produção do mês">
        {ranking.length === 0 ? <EmptyNote text="Nenhuma produção lançada este mês." /> : (
          <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
            {ranking.map((p, i) => (
              <div key={p.id} style={{ display: "flex", justifyContent: "space-between", alignItems: "center", padding: "8px 12px", background: ICE, borderRadius: 8, fontSize: 13 }}>
                <span><b>#{i + 1}</b> {consultorNome(p.consultorId)}</span>
                <span>{p.placasVendidas} placas</span>
              </div>
            ))}
          </div>
        )}
      </SectionCard>

      <SectionCard title="Produção mensal" right={<button style={btnGhost} onClick={onNewProducao}><Plus size={14} /> Lançar produção</button>}>
        <DataTable columns={columnsProducao} rows={[...producao].sort((a, b) => (b.competencia || "").localeCompare(a.competencia || ""))} onEdit={onEditProducao} onDelete={onDeleteProducao} emptyText="Nenhuma produção lançada." />
      </SectionCard>
    </div>
  );
}


function Relatorios({ associados, vendas, associadoNome }) {
  const [filtros, setFiltros] = useState({ origem: "", plano: "", status: "", periodoInicio: "", periodoFim: "" });
  const set = (k) => (e) => setFiltros((s) => ({ ...s, [k]: e.target.value }));

  const associadoOrigem = (id) => associados.find((a) => a.id === id)?.origem || "";

  const filtrados = vendas.filter((v) =>
    (!filtros.origem || associadoOrigem(v.associadoId) === filtros.origem) &&
    (!filtros.plano || v.plano === filtros.plano) &&
    (!filtros.status || v.status === filtros.status) &&
    (!filtros.periodoInicio || (v.data || "") >= filtros.periodoInicio) &&
    (!filtros.periodoFim || (v.data || "") <= filtros.periodoFim)
  );

  const porPlano = {};
  filtrados.forEach((v) => { const p = v.plano || "Sem plano"; porPlano[p] = (porPlano[p] || 0) + 1; });
  const porOrigem = {};
  filtrados.forEach((v) => { const o = associadoOrigem(v.associadoId) || "Sem origem"; porOrigem[o] = (porOrigem[o] || 0) + 1; });

  const columns = [
    { key: "data", label: "Data", render: (r) => formatDateBR(r.data) },
    { key: "associado", label: "Associado", render: (r) => associadoNome(r.associadoId) },
    { key: "veiculoPlaca", label: "Placa" },
    { key: "plano", label: "Plano" },
    { key: "origem", label: "Origem", render: (r) => associadoOrigem(r.associadoId) || "—" },
    { key: "status", label: "Status", render: (r) => <Badge text={r.status} tone={statusTone(r.status)} /> },
    { key: "valorAdesao", label: "Adesão", render: (r) => formatBRL(toNumber(r.valorAdesao)) },
  ];

  return (
    <div style={{ display: "flex", flexDirection: "column", gap: 18 }}>
      <SectionCard title="Filtros">
        <div className="grid-3col" style={{ display: "grid", gridTemplateColumns: "repeat(3, 1fr)", gap: 12 }}>
          <Field label="Origem"><Select options={ORIGEM_OPTS} value={filtros.origem} onChange={set("origem")} /></Field>
          <Field label="Plano"><Select options={PLANO_OPTS} value={filtros.plano} onChange={set("plano")} /></Field>
          <Field label="Status"><Select options={VENDA_STATUS_OPTS} value={filtros.status} onChange={set("status")} /></Field>
          <Field label="Contrato de"><TextInput type="date" value={filtros.periodoInicio} onChange={set("periodoInicio")} /></Field>
          <Field label="Contrato até"><TextInput type="date" value={filtros.periodoFim} onChange={set("periodoFim")} /></Field>
        </div>
      </SectionCard>

      <div className="grid-2col" style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 20 }}>
        <SectionCard title="Ranking de planos">
          {Object.keys(porPlano).length === 0 ? <EmptyNote text="Sem dados." /> : (
            <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
              {Object.entries(porPlano).sort((a, b) => b[1] - a[1]).map(([k, v]) => (
                <div key={k} style={{ display: "flex", justifyContent: "space-between", fontSize: 13 }}><span>{k}</span><b>{v}</b></div>
              ))}
            </div>
          )}
        </SectionCard>
        <SectionCard title="Origem das vendas">
          {Object.keys(porOrigem).length === 0 ? <EmptyNote text="Sem dados." /> : (
            <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
              {Object.entries(porOrigem).sort((a, b) => b[1] - a[1]).map(([k, v]) => (
                <div key={k} style={{ display: "flex", justifyContent: "space-between", fontSize: 13 }}><span>{k}</span><b>{v}</b></div>
              ))}
            </div>
          )}
        </SectionCard>
      </div>

      <SectionCard
        title={`Carteira filtrada (${filtrados.length})`}
        right={
          <div style={{ display: "flex", gap: 8 }}>
            <button style={btnGhost} onClick={() => exportXLSX(
              filtrados.map((v) => ({ data: v.data, associado: associadoNome(v.associadoId), origem: associadoOrigem(v.associadoId), placa: v.veiculoPlaca, plano: v.plano, status: v.status, adesao: toNumber(v.valorAdesao), consultoria: toNumber(v.consultoria) })),
              "ancore-relatorio-vendas.xlsx", "Vendas"
            )}>
              <Download size={14} /> Excel
            </button>
            <button style={btnGhost} onClick={() => window.print()}><Printer size={14} /> Imprimir / PDF</button>
          </div>
        }
      >
        <DataTable columns={columns} rows={filtrados} emptyText="Nenhum registro para os filtros selecionados." />
      </SectionCard>
    </div>
  );
}

/* =================================================================
   CONFIGURAÇÕES
================================================================= */

  return (
    <div style={{ display: "flex", flexDirection: "column", gap: 20 }}>
      <SectionCard title="Seu cargo atual">
        <div style={{ display: "grid", gridTemplateColumns: "1fr 2fr", gap: 14, alignItems: "end" }}>

          </div>

      <SectionCard title="Regras oficiais da Ancore (fixas)">

        <div style={{ display: "flex", flexDirection: "column", gap: 18 }}>

              A cada {RECORRENCIA_BLOCO} placas ativas (boletos pagos) no mês anterior → {formatBRL(RECORRENCIA_VALOR_POR_BLOCO)}.<br />

            <div style={{ fontWeight: 700, fontSize: 13, marginBottom: 8 }}>Consultoria especializada</div>

              Mínimo {CONSULTORIA_PLACAS_ATIVAS_MINIMAS} placas com consultoria ativa.<br />
              Consultores e Líderes: mínimo 5 vendas pessoais no mês anterior. Gestores: mínimo {EQUIPE_VENDAS_MIN_POR_PESSOA}.<br />
              Valores permitidos: {CONSULTORIA_VALORES.map((v) => formatBRL(v)).join(" · ")}.

          </div>

          <div>
            <div style={{ fontWeight: 700, fontSize: 13, marginBottom: 8 }}>Plano de Carreira (produção pessoal + equipe do mês anterior)</div>
            <table style={{ width: "100%", fontSize: 13, borderCollapse: "collapse" }}>
              <thead>
                <tr style={{ textAlign: "left", color: MUTED }}>
                  <th style={{ padding: "4px 8px 8px 0" }}>Nível</th><th>Placas</th><th>Premiação</th>
                </tr>
              </thead>
              <tbody>
                {PLANO_FAIXAS.map((f) => (
                  <tr key={f.nivel} style={{ borderTop: "1px solid #EEE" }}>
                    <td style={{ padding: "6px 8px 6px 0" }}>{f.nivel}</td>
                    <td>{f.min}+</td>
                    <td>{formatBRL(f.premiacao)}</td>
                  </tr>
                ))}
              </tbody>
            </table>
            <div style={{ fontSize: 12.5, color: MUTED, marginTop: 8 }}>
              Para níveis com premiação, exige-se pelo menos {EQUIPE_MIN_ELEGIVEIS} pessoas da equipe com {EQUIPE_VENDAS_MIN_POR_PESSOA}+ vendas no mês.
            </div>
          </div>

          <div>
            <div style={{ fontWeight: 700, fontSize: 13, marginBottom: 8 }}>Premiação semanal</div>
            <div style={{ fontSize: 13, color: MUTED }}>A cada {PREMIACAO_SEMANAL_BLOCO} placas entregues na semana (segunda a domingo) → {formatBRL(PREMIACAO_SEMANAL_VALOR)}.</div>
          </div>

          <div>
            <div style={{ fontWeight: 700, fontSize: 13, marginBottom: 8 }}>Premiação mensal (por placas vendidas no mês)</div>
            <table style={{ width: "100%", fontSize: 13, borderCollapse: "collapse" }}>
              <thead><tr style={{ textAlign: "left", color: MUTED }}><th style={{ padding: "4px 8px 8px 0" }}>Placas</th><th>Premiação</th></tr></thead>
              <tbody>
                {PREMIACAO_MENSAL_FAIXAS.map((f) => (
                  <tr key={f.min} style={{ borderTop: "1px solid #EEE" }}>
                    <td style={{ padding: "6px 8px 6px 0" }}>{f.min}+</td><td>{formatBRL(f.valor)}</td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
        </div>
      </SectionCard>
    </div>
  );
}

ReactDOM.createRoot(rootEl).render(<App />);

</script>
